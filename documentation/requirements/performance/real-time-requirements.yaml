# Retired, not reused:
#   REQ-PERF-003: a coding rule, kept in AGENTS.md

- id: REQ-PERF-001
  title: FOC inner-loop execution time
  shall: >
    The application callback that runs inside the control interrupt — encoder read, Calculate()
    of the FOC inner loop and PWM write — shall complete within 4500 CPU cycles at 120 MHz (37.5
    microseconds), leaving 25% of the 50 microsecond control period as headroom for hardware ISR
    entry/exit. This is the window REQ-PERF-004 measures on target. The static
    cortex-cycle-budget CI gate enforces the same 4500 cycles on the symbols its configuration
    lists (fail-over-max-cycles: 4500).

- id: REQ-PERF-002
  title: FOC outer-loop execution time
  shall: >
    The outer control loop, which runs the speed and position cascades and the online
    mechanical estimator below the current loop, shall complete within 20000 CPU cycles
    at 120 MHz. This budget is enforced by the cortex-cycle-budget CI gate
    (fail-over-max-cycles: 20000).

- id: REQ-PERF-004
  title: The control interrupt measures its own execution time
  status: verified
  verification: sil
  shall: >
    The platform shall measure the duration of every control-interrupt execution with the Cortex-M
    cycle counter, or on the emulated target, which has none, with a free-running timer of its
    instruction-counted clock, and shall maintain, without dynamic allocation, the last, minimum,
    maximum and a filtered average of that duration, together with the count of executions. The
    measurement shall span the application callback — encoder read, control law and PWM write — that
    executes inside the interrupt context. Hardware ISR entry/exit overhead and any platform-
    specific pre-processing that is not part of the real-time control law (such as simulation model
    steps in QEMU) are excluded from the measured window. That window is the scope of the
    REQ-PERF-001 budget of 4500 cycles at 120 MHz.

- id: REQ-PERF-005
  title: Overruns and deadline misses are counted separately
  shall: >
    The platform shall count separately the executions that exceed the cycle budget and those that
    exceed the control period. Exceeding the budget means the margin is spent while the deadline was
    still met; exceeding the period means the next conversion was already due. Both counters shall
    saturate rather than wrap, so a long run cannot be mistaken for a healthy one.

- id: REQ-PERF-006
  title: A control interrupt that re-enters is detected as it happens
  shall: >
    The platform shall count each control interrupt that arrives while the previous one has not
    returned. A duration can only report a missed deadline after the fact; re-entry is the same
    failure observed as it occurs, and no measured duration reveals it.

- id: REQ-PERF-007
  title: Every CAN error class is counted
  shall: >
    The CAN adapter shall count every error class it reports, not only the bus-off condition that
    raises a fault. Counting shall happen on the common adapter base so that no reporting path can
    omit it, and the counters shall be readable from the command line.

- id: REQ-PERF-008
  title: Calibration, commanded alignment and closed-loop running hold the control-interrupt budget
  status: verified
  verification: sil
  shall: >
    Through a full calibration, while the rotor is aligned on command and while the motor then
    runs closed loop in any control mode, no control-interrupt execution shall exceed the budget
    or the control period, and none shall re-enter. Rotor alignment and every identification
    procedure shall deliver its outcome from the event loop, not from the interrupt that
    decides it. Mechanical identification shall fit its observations from the event loop: the
    control interrupt shall only accumulate each observation window, check the envelope, hand
    the closed window over and record the outcome, and on windows at least as long as the
    procedure's 1 ms tick it shall schedule no event-loop work.
