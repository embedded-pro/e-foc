- id: REQ-CAL-001
  title: Current injection aborts above the inverter limit
  shall: >
    Every calibration procedure that injects current into a stationary motor — encoder
    alignment, pole-pairs estimation, resistance estimation and sinusoidal inductance
    estimation — shall compare each phase-current sample against the inverter's
    maximum supported current and, on the first sample whose magnitude exceeds that
    limit in any phase and in either direction, shall stop the inverter and report the
    procedure as failed.

- id: REQ-CAL-002
  title: Alignment zeroes the encoder while the rotor is held
  shall: >
    The alignment procedure shall read the settled rotor position and zero the encoder
    while the alignment voltage is still applied, and shall stop the inverter only
    afterwards, so that the recorded zero corresponds to the position the rotor was
    held at rather than to one it may have drifted to.

- id: REQ-CAL-003
  title: Alignment reports a mechanical offset
  shall: >
    The alignment procedure shall report the offset it measured as a mechanical angle,
    unscaled by the pole-pair count, so that a consumer converting it to an electrical
    angle does so exactly once.

- id: REQ-CAL-004
  title: Mechanical identification drives the motor through the control loop
  shall: >
    Mechanical identification shall obtain its phase-current samples by observing the
    running control loop, and shall start and stop the drive through the controller it was
    given. It shall not claim the inverter's phase-current callback for itself: that
    callback is the control loop's only path to the PWM output, so claiming it leaves the
    rotor stationary, the regressor without excitation, and the estimate unreachable.

- id: REQ-CAL-005
  title: An aborted calibration procedure drops its completion
  shall: >
    Every calibration procedure shall offer an abort that stops injection, cancels its
    timers and discards its pending completion without invoking it, so that a caller that
    aborts owns the outcome and a fault cannot be overwritten by the result of the
    procedure it interrupted. A procedure that has been aborted or has completed shall
    ignore any further phase-current sample it is handed.

- id: REQ-CAL-006
  title: A second alignment request is rejected rather than dropped
  shall: >
    When encoder alignment is asked to start while a run is already in flight, the service shall
    report the new request as failed through its own completion rather than returning silently. A
    dropped completion leaves the caller waiting for a result that will never arrive.

- id: REQ-CAL-007
  title: Encoder alignment is bounded in time, not only in samples
  shall: >
    Encoder alignment shall fail after a configurable timeout measured from the start of the run.
    Its sample budget bounds the run only while phase-current samples keep arriving, so a drive
    that never starts delivers none and nothing else ends the step.

- id: REQ-CAL-008
  title: Mechanical identification runs against live control loops
  shall: >
    Before mechanical identification is started, the state machine shall apply the electrical
    model it has just measured — phase resistance, inductance, pole pairs and flux linkage —
    together with a bounded provisional mechanical model, and shall abandon the calibration
    run as failed when either cannot be applied. Until both are applied the current loop holds
    inert gains and the speed loop a zero current envelope, so the commanded excitation never
    reaches the rotor and the run can only time out.

- id: REQ-CAL-009
  title: The provisional plant is never treated as a calibration result
  shall: >
    The provisional mechanical model applied for the duration of identification shall not be
    persisted, reported as calibration data, or left in place after the run. When the run fails,
    is aborted, or is interrupted by an emergency stop, the state machine shall restore the
    model the drive held before the run, or, when no valid calibration is held, shall leave the
    motor un-enableable until a calibration succeeds.

- id: REQ-CAL-010
  title: Mechanical excitation is bounded in current, speed and time
  shall: >
    The mechanical identification trajectory shall alternate between two commanded speed levels
    so that every transition excites the acceleration term of the regressor, and shall be given
    an explicit current envelope, a finite speed limit and a duration. The run shall end without an
    estimate on the first sample whose phase current exceeds the envelope or whose measured speed
    exceeds the limit, and shall stop the power stage from that same sample rather than leaving it
    driving until deferred cleanup runs. It shall keep evaluating the envelope on every sample until
    the drive is released, so that a violation arriving after an estimate has converged still
    invalidates it. A configuration that does not define a usable bounded trajectory — an infinite
    speed limit included — shall be rejected through the completion rather than started.

- id: REQ-CAL-011
  title: One-shot and online mechanical estimates share one acceptance policy
  shall: >
    An observation shall update a mechanical estimator only when the rotor is both moving and
    accelerating, because a constant speed leaves the intercept and speed columns collinear and
    the acceleration column at zero while still inflating the covariance. An estimate shall be
    reported or published only after a minimum number of such observations, once the estimator
    has converged against an uncertainty bound scaled to its forgetting factor, and only when
    inertia and viscous friction are finite and inside the documented physical band. The one-shot
    procedure and the online estimator shall apply the same policy, and an estimate that fails it
    shall be reported as absent rather than persisted.

- id: REQ-CAL-012
  title: Electrical identification reports the plant it measured
  shall: >
    Run against a plant whose parameters are known, the electrical identification command
    shall report a phase resistance within 5 % and a phase inductance within 20 % of the
    plant's, and the plant's pole-pair count exactly, for each reference motor, and shall hold
    a 10 % and 25 % envelope with current measurement noise of 0.05 A standard deviation and
    0.02 A bias and encoder noise of 0.2 mrad. The comparison is made on the values the command
    itself broadcasts, not on a test-only readout.

- id: REQ-CAL-013
  title: The full calibration identifies the mechanical parameters of the plant
  shall: >
    Run from a stored calibration whose resistance, inductance, inertia and friction are
    deliberately wrong by a factor of 1.3, 0.7, 2.0 and 0.5, the full calibration sequence
    shall store a record whose resistance is within 5 %, inductance within 20 %, inertia within
    5 % and viscous friction within 10 % of the plant's, with the plant's pole-pair count, for
    each reference motor. The record shall be traced when it is stored so that the comparison
    is made on what the motor will run with.

- id: REQ-CAL-014
  title: Online estimates converge on the plant from a wrong seed
  shall: >
    Seeded from a stored calibration whose values are wrong by the factors of REQ-CAL-013 and
    excited for three seconds by a speed reference alternating between 26 and 52 rad/s every
    250 ms, the online estimators shall report an inertia within 20 %, a viscous friction within
    30 % and an inductance within 15 % of the plant's, for each reference motor, and shall hold
    the same envelope for inertia and friction with a constant shaft torque of 0.01 N·m applied
    during the excitation. The estimates shall be readable through the product's own terminal
    command.
