- id: REQ-CTL-001
  title: Torque mode delivers the commanded current
  status: verified
  verification: [sil, mil, hil, unit]
  shall: >
    In torque mode the drive shall regulate the d- and q-axis currents to the operator's setpoints
    with every selectable current law, settling a step within the envelope its acceptance criteria
    give, and shall hold the q-axis current within 1 % of the command plus 5 mA in steady state,
    including on boards with dead-time loss, low-side shunts or a duty applied a period late. With
    a cogging map stored it shall cancel the cogging torque while reporting the operator's demand.
  rationale: >
    The per-law settling, overshoot, rise-time and tail limits are acceptance criteria and live in
    the Examples tables of the scenarios that cite this requirement.

- id: REQ-CTL-002
  title: Speed mode holds the commanded speed
  status: verified
  verification: [sil, mil, hil]
  shall: >
    In speed mode the drive shall bring the rotor to the operator's speed setpoint and hold it with
    every selectable speed law, within the step and disturbance envelopes its acceptance criteria
    give for either sign of load, recovering once a saturated demand fits the current limit again.
    It shall limit the reference to the operator's acceleration and deceleration ramps.

- id: REQ-CTL-003
  title: Position mode reaches and holds the commanded position
  status: verified
  verification: [sil, mil, hil, unit]
  shall: >
    In position mode the drive shall move the rotor to the operator's position setpoint, a
    single-turn mechanical angle, and hold it with every selectable position law, within the step
    and disturbance envelopes its acceptance criteria give, also against cogging and dry friction.
    Without software position limits it shall take the shorter way round. It shall report the
    target reached once the error has stayed within the position window for the position-window
    time, and shall report the position in the setpoint's own turn.

- id: REQ-CTL-004
  title: The control laws stay stable on motors other than the nominal one
  status: verified
  verification: [sil, mil]
  shall: >
    The speed and position laws shall settle and stay near their setpoints with a noisy encoder
    and current measurement, a winding near its thermal limit, a loaded shaft and on the second
    reference motor, within the envelopes their acceptance criteria give.

- id: REQ-CTL-005
  title: Each loop's control law is selectable at runtime
  status: verified
  verification: sil
  shall: >
    The operator shall select the control law of the current, speed and position loop over CAN
    from a fixed set, without a firmware update or restart, and query the law each loop runs. The
    drive shall refuse a selection while Enabled or one whose law needs a mechanical model it does
    not yet hold, and shall persist an accepted selection across power cycles.

- id: REQ-CTL-006
  title: Each loop is tuned by its bandwidth
  status: verified
  verification: sil
  shall: >
    Each loop shall derive its gains from the identified motor model and a bandwidth, which the
    operator may set or leave automatic, together with its law's own settings. The drive shall
    store and restore these settings, and shall refuse without effect a setting that is out of
    range, given while the drive is not stopped, or one the active law cannot be designed for.

- id: REQ-CTL-007
  title: Position travel stays within the software limits
  status: verified
  verification: [sil, unit]
  shall: >
    With software position limits set, position mode shall refuse a setpoint outside them, move
    between two points inside them without crossing the excluded arc, and enter Fault with
    positionLimit within 2 ms of the rotor being carried more than four encoder counts outside
    them.

- id: REQ-CTL-008
  title: Speed and position mode counter the rotor's dry friction
  status: implemented
  verification: [mil, unit]
  shall: >
    In speed and position mode, once the calibration has stored a dry friction, the drive shall
    add the torque that cancels it in the direction the speed reference asks the rotor to turn,
    fading it out as the reference nears zero so that it does not chatter about
    standstill, and shall keep the total demand within the current limit. Torque mode shall add
    none, and a slow start from rest shall meet less speed error than it does without it.

- id: REQ-CTL-009
  title: The direct-axis current stays near its reference at high speed
  status: implemented
  verification: [mil, unit]
  shall: >
    At speeds where the rotor turns a noticeable fraction of an electrical revolution during one
    control period, the drive shall keep the direct-axis current excursion after a change of speed
    demand within the limit set for each current law, whether the power stage applies a new duty at
    once or a period after it is computed.

- id: REQ-CTL-010
  title: Position moves follow a profile within the operator's limits
  status: verified
  verification: [sil, mil, unit]
  shall: >
    With a profile velocity and acceleration set, position mode shall move the rotor to a new
    setpoint along a path whose speed, acceleration and deceleration stay within the operator's
    limits, starting from the motion already under way when the setpoint changes, and shall
    follow it within the error its acceptance criteria give. With them unset it shall behave as
    without a profile.
