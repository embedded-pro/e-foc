- id: REQ-CAN-001
  title: One authoritative wire contract for the FOC motor category
  shall: >
    The message identifiers, enumerations, scale factors and per-message field layouts of CAN
    category 0x02 shall be defined once, in core/can. No producer or consumer of those frames — the
    category server, the category client, the commander tool or the integration test fixtures —
    shall restate an identifier, a scale or an enumerator; each shall reference the single
    definition. Every decode shall derive its accepted payload length from that definition rather
    than from a restated constant, and every message layout shall be pinned by the byte-level
    vectors of REQ-CAN-004.
  rationale: >
    The byte-level vectors are what detect a field order or width that has drifted from the
    definition. Encoding and decoding are written against the definition rather than generated from
    it: a descriptor edit changes the accepted length and fails the vectors, and the accompanying
    encode or decode change is made by hand.

- id: REQ-CAN-002
  title: Payload length is exact
  shall: >
    Every decode of a category 0x02 frame shall require the payload to be exactly the length its
    definition states, counting the sequence byte that commands carry and responses do not. A
    frame of any other length shall be answered with invalidPayload and shall not be partially
    decoded, so that a frame built to a different layout of the same identifier is rejected
    rather than reinterpreted under this one.

- id: REQ-CAN-003
  title: Contract version is queryable and mismatch is reported
  shall: >
    The server shall answer a contract-version query with the major and minor version of the
    contract it implements, in every lifecycle state. A client whose major version differs from
    the server's shall report the mismatch to its operator and shall send that server no further
    category 0x02 command; servers on the same bus whose major matches stay commandable. Adding
    a message, a parameter or an enumerator to an existing field shall increment the minor
    version, as contract versions 2.1, 2.4 and 2.7 did; changing any field layout, or the meaning
    of any existing enumerator, shall increment the major version.

- id: REQ-CAN-004
  title: The contract is verified byte for byte and end to end
  shall: >
    Every command and every response shall be verified against literal expected bytes, written
    independently of the helpers that encode and decode them, and the client and the server shall
    be verified against each other rather than only against their own test doubles, so that a
    layout both sides state wrongly in the same way is still caught.

- id: REQ-CAN-005
  title: Deviations from the reference example are documented
  shall: >
    Where this contract differs from the can-lite reference example that claims the same category
    identifier, the difference and its reason shall be recorded in the protocol design document,
    and the rejection behaviour a frame built to the example receives shall be stated.

- id: REQ-CAN-006
  title: A controller's node ID is its configured base plus its board ID, fixed at start-up
  shall: >
    A controller shall answer on the CAN node ID equal to its configured base node ID plus the
    board ID read from its ID jumpers, so that boards running the same firmware and configuration
    can share a bus. The board ID shall be read once, at start-up; a jumper changed while running
    shall take effect only after a reset. A board without ID jumpers shall use board ID 0. A
    configured base of 0, the broadcast address, or one whose sum with the board ID exceeds the
    12-bit node field shall be replaced by the default base of 1.

- id: REQ-CAN-007
  title: Loop tuning, motor and start-up settings are reachable by number
  status: verified
  verification: sil
  shall: >
    Contract version 2.1 shall add, without changing any 2.0 message, a numbered parameter
    space covering every loop tuning setting, the six motor parameters of the calibration
    record and the start-up settings (encoder resolution, CAN node ID base and bitrate),
    each with a unit and a range defined once in core/can, and the commands to select and
    query each loop's algorithm. A write shall be acknowledged only once the value is in force
    and stored, preceded by a response carrying the value now held; a query shall answer the
    value in force, flagged when the firmware chose it automatically. A value that is not
    finite, outside its range or not whole for an integer parameter shall be answered with
    invalidPayload and change nothing. The telemetry rate is not a numbered parameter; it is set
    by the ConfigureTelemetryRate command (0x0D).

- id: REQ-CAN-009
  title: Commissioning needs no terminal
  shall: >
    Contract version 2.2 shall add, without changing any 2.1 message, a Calibrate command that
    runs the full calibration sequence and is acknowledged when it ends, a ClearCalibration
    command that invalidates the stored calibration record, and a ClearDiagnostics command
    that resets the control-loop and CAN statistics. Calibrate and ClearCalibration shall be
    refused with invalidState unless the drive is stopped.

- id: REQ-CAN-010
  title: Diagnostics are readable by number
  shall: >
    Contract version 2.2 shall make the calibration record's current-sensor offsets and
    cogging peak, the online estimates of resistance, inductance, inertia and viscous
    friction, the control-loop execution statistics and the cause of the last reset readable
    through QueryParameter as read-only parameters. SetParameter on a read-only parameter
    shall be answered with invalidPayload and change nothing.

- id: REQ-CAN-011
  title: The supervision settings and the stall fault are reachable by number
  status: verified
  verification: sil
  shall: >
    Contract version 2.4 shall add, without changing any 2.3 message, the supervision settings
    of REQ-SM-033 as numbered parameters, each with a unit and a range defined once in core/can,
    writable in any state and answered as REQ-CAN-007 answers a start-up setting, and a stall
    value of the fault code carried by the status telemetry and the fault event.

- id: REQ-CAN-008
  title: Floating-point fields have one byte order
  status: verified
  verification: sil
  shall: >
    A float32 field of the category shall be the IEEE 754 single-precision bit pattern sent
    most significant byte first, as every other multi-byte field of the category is.

- id: REQ-CAN-012
  title: Measured currents and rotor position are streamed at the configured rate
  status: verified
  verification: sil
  shall: >
    Contract version 2.5 shall add, without changing any 2.4 message other than retiring the
    never-sent TelemetryElectrical frame (0x88), a TelemetryCurrents telemetry frame carrying a
    wrapping 8-bit window sequence number, the mean measured d- and q-axis currents over the
    window at 1 mA resolution and the encoder's mechanical angle at the window's last sample at
    0.1 mrad resolution. While a CAN client is online and a closed-loop control mode runs, the
    drive shall send one such frame per window, a window being the whole number of control
    periods nearest to one period of the configured telemetry rate. The rate shall accept 0,
    which stops the stream, to 1000 Hz; a larger rate shall be answered with invalidPayload and
    change nothing. Every window the control loop closes shall take the next sequence number,
    so that a window the drive could not send appears to the client as a gap in the sequence.

- id: REQ-CAN-013
  title: A missing phase is reported with its own fault code
  status: verified
  verification: sil
  shall: >
    Contract version 2.7 shall add, without changing any 2.6 message, a phaseMissing value (7)
    of the fault code carried by the status telemetry and the fault event, sent whenever the
    drive is in Fault with phaseMissing (REQ-EH-015).

- id: REQ-CAN-014
  title: Every fault and the Ready state are reported with their own codes
  status: verified
  verification: [sil, unit]
  shall: >
    Contract version 2.8 shall add, without changing any 2.7 message, a ready value (5) of the
    motor state and hardwareFault (8) and calibrationFailed (9) values of the fault code carried
    by the status telemetry and the fault event. Every fault the drive raises shall be reported
    with a code of its own, none going out as none, and a drive in Ready shall be reported as
    ready, distinctly from a drive in Idle, which is reported as idle or partialCalibration.

- id: REQ-CAN-015
  title: Drive-wide limits are settable over CAN and their faults have codes of their own
  status: verified
  verification: sil
  shall: >
    Contract version 2.9 shall add, without changing any 2.8 message, the stored settings
    overspeedLimit (0x50) in rad/s, followingErrorWindow (0x51) in rad, followingErrorTime
    (0x52) in s, speedAcceleration (0x53) and speedDeceleration (0x54) in rad/s² and
    commandTimeout (0x55) in s, continuousCurrent (0x56) and peakCurrent (0x57) in A and
    peakCurrentTime (0x58) in s, and overSpeed (10), followingError (11) and commandTimeout (12)
    values of the fault code carried by the status telemetry and the fault event. Each setting
    shall be writable in any state, answered with the value held once it is stored in the
    configuration record, refused with invalidPayload outside its range without changing
    anything, and read back unchanged after a restart.

- id: REQ-CAN-016
  title: The position window is settable over CAN and the target-reached flag is readable
  status: verified
  verification: [sil, unit]
  shall: >
    Contract version 2.10 shall add, without changing any 2.9 message, the stored settings
    positionWindow (0x59) in rad, 0 to 3.2, and positionWindowTime (0x5A) in s, 0 to 10, and the
    read-only parameter targetReached (0xC0), 1 when the target is reached and 0 otherwise. Each
    setting shall be writable in any state, answered with the value held once it is stored in the
    configuration record, refused with invalidPayload outside its range without changing anything,
    and read back unchanged after a restart; targetReached shall be refused by SetParameter with
    invalidPayload.

- id: REQ-CAN-017
  title: The software position limits are settable over CAN
  status: verified
  verification: [sil, unit]
  shall: >
    Contract version 2.11 shall add, without changing any 2.10 message, the stored settings
    positionMinimum (0x5B) and positionMaximum (0x5C) in rad, -3.2 to 3.2. Each setting shall be
    writable in any state, answered with the value held once it is stored in the configuration
    record, refused with invalidPayload outside its range without changing anything, and read back
    unchanged after a restart; with the limits on, a position setpoint outside them shall be
    acknowledged invalidPayload.

- id: REQ-CAN-018
  title: The position limit fault has a code of its own
  status: verified
  verification: sil
  shall: >
    Contract version 2.12 shall add, without changing any 2.11 message, the positionLimit (13)
    value of the fault code carried by the status telemetry and the fault event.

- id: REQ-CAN-019
  title: The winding temperature and its calibration temperature are readable and settable over CAN
  status: verified
  verification: [sil, unit]
  shall: >
    Contract version 2.13 shall add, without changing any 2.12 message, the stored setting
    calibrationTemperature (0x5D) in degC, -40 to 100, writable in any state, answered with the
    value held once stored, refused with invalidPayload outside its range and read back unchanged
    after a restart, and the read-only parameter windingTemperature (0xC1) in degC, not a number
    while the temperature is unknown.

- id: REQ-CAN-020
  title: The temperature limit and its margin are settable over CAN
  status: verified
  verification: [sil, unit]
  shall: >
    Contract version 2.14 shall add, without changing any 2.13 message, the stored settings
    temperatureLimit (0x5E) in degC, 40 to 200, and temperatureMargin (0x5F) in K, 1 to 50, each
    writable in any state, answered with the value held once stored, refused with invalidPayload
    outside its range and read back unchanged after a restart.

- id: REQ-CAN-021
  title: The bus-voltage limits are settable over CAN
  status: verified
  verification: [sil, unit]
  shall: >
    Contract version 2.15 shall add, without changing any 2.14 message, the stored settings
    busVoltageMinimum (0x30) and busVoltageMaximum (0x31) in V, 0 to 100, each writable in any
    state, answered with the value held once stored, refused with invalidPayload outside its range
    and read back unchanged after a restart.

- id: REQ-CAN-022
  title: A quick stop is commanded over CAN and reported as stopping
  status: verified
  verification: [sil, unit]
  shall: >
    The motor controller shall expose a quick stop command over CAN, acknowledged once the
    deceleration starts and refused with invalid state while the drive calibrates; a stopping
    motor state reported while the drive decelerates after a quick stop; and a stored quick-stop
    deceleration setting, writable in any state and preserved across restarts.
