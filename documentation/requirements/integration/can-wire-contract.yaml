- id: REQ-CAN-001
  title: One authoritative wire contract for the FOC motor category
  shall: >
    The message identifiers, enumerations, scale factors and per-message field layouts of CAN
    category 0x02 shall be defined once, in core/can. No producer or consumer of those frames —
    the category server, the category client, the commander tool or the integration test
    fixtures — shall restate an identifier, a scale or an enumerator; each shall reference the
    single definition. Every decode shall derive its accepted payload length from that
    definition rather than from a restated constant, and every message layout shall be pinned
    by the byte-level vectors of REQ-CAN-004, which are what detect a field order or width that
    has drifted from the definition. Encoding and decoding are written against the definition
    rather than generated from it: a descriptor edit changes the accepted length and fails the
    vectors, and the accompanying encode or decode change is made by hand.

- id: REQ-CAN-002
  title: Payload length is exact
  shall: >
    Every decode of a category 0x02 frame shall require the payload to be exactly the length its
    definition states, counting the sequence byte that commands carry and responses do not. A
    frame of any other length shall be answered with invalidPayload and shall not be partially
    decoded, so that a frame built to a different layout of the same identifier is rejected
    rather than reinterpreted under this one.

- id: REQ-CAN-003
  title: Contract version is queryable and mismatch is reported
  shall: >
    The server shall answer a contract-version query with the major and minor version of the
    contract it implements, in every lifecycle state. A client whose major version differs from
    the server's shall report the mismatch to its operator and shall send that server no further
    category 0x02 command; servers on the same bus whose major matches stay commandable. Adding
    a message shall increment the minor version; changing any field layout, or the meaning of
    any enumerator, shall increment the major version.

- id: REQ-CAN-004
  title: The contract is verified byte for byte and end to end
  shall: >
    Every command and every response shall be verified against literal expected bytes, written
    independently of the helpers that encode and decode them, and the client and the server shall
    be verified against each other rather than only against their own test doubles, so that a
    layout both sides state wrongly in the same way is still caught.

- id: REQ-CAN-005
  title: Deviations from the reference example are documented
  shall: >
    Where this contract differs from the can-lite reference example that claims the same category
    identifier, the difference and its reason shall be recorded in the protocol design document,
    and the rejection behaviour a frame built to the example receives shall be stated.

- id: REQ-CAN-006
  title: A controller's node ID is its configured base plus its board ID, fixed at start-up
  shall: >
    A controller shall answer on the CAN node ID equal to its configured base node ID plus the
    board ID read from its ID jumpers, so that boards running the same firmware and configuration
    can share a bus. The board ID shall be read once, at start-up; a jumper changed while running
    shall take effect only after a reset. A board without ID jumpers shall use board ID 0. A
    configured base of 0, the broadcast address, or one whose sum with the board ID exceeds the
    12-bit node field shall be replaced by the default base of 1.

- id: REQ-CAN-007
  title: Every setting the firmware holds is reachable by number
  shall: >
    Contract version 2.1 shall add, without changing any 2.0 message, a numbered parameter
    space covering every loop tuning setting, the six motor parameters of the calibration
    record and the start-up settings (encoder resolution, CAN node ID base and bitrate),
    each with a unit and a range defined once in core/can, and the commands to select and
    query each loop's algorithm. A write shall be acknowledged only once the value is in force
    and stored, preceded by a response carrying the value now held; a query shall answer the
    value in force, flagged when the firmware chose it automatically. A value that is not
    finite, outside its range or not whole for an integer parameter shall be answered with
    invalidPayload and change nothing.

- id: REQ-CAN-009
  title: Commissioning needs no terminal
  shall: >
    Contract version 2.2 shall add, without changing any 2.1 message, a Calibrate command that
    runs the full calibration sequence and is acknowledged when it ends, a ClearCalibration
    command that invalidates the stored calibration record, and a ClearDiagnostics command
    that resets the control-loop and CAN statistics. Calibrate and ClearCalibration shall be
    refused with invalidState unless the drive is stopped.

- id: REQ-CAN-010
  title: Diagnostics are readable by number
  shall: >
    Contract version 2.2 shall make the calibration record's current-sensor offsets and
    cogging peak, the online estimates of resistance, inductance, inertia and viscous
    friction, the control-loop execution statistics and the cause of the last reset readable
    through QueryParameter as read-only parameters. SetParameter on a read-only parameter
    shall be answered with invalidPayload and change nothing.

- id: REQ-CAN-011
  title: The supervision settings and the stall fault are reachable by number
  shall: >
    Contract version 2.4 shall add, without changing any 2.3 message, the supervision settings
    of REQ-SM-033 as numbered parameters, each with a unit and a range defined once in core/can,
    writable in any state and answered as REQ-CAN-007 answers a start-up setting, and a stall
    value of the fault code carried by the status telemetry and the fault event.

- id: REQ-CAN-008
  title: Floating-point fields have one byte order
  shall: >
    A float32 field of the category shall be the IEEE 754 single-precision bit pattern sent
    most significant byte first, as every other multi-byte field of the category is.

- id: REQ-CAN-012
  title: Measured currents and rotor position are streamed at the configured rate
  shall: >
    Contract version 2.5 shall add, without changing any 2.4 message other than retiring the
    never-sent TelemetryElectrical frame (0x88), a TelemetryCurrents telemetry frame carrying a
    wrapping 8-bit window sequence number, the mean measured d- and q-axis currents over the
    window at 1 mA resolution and the encoder's mechanical angle at the window's last sample at
    0.1 mrad resolution. While a CAN client is online and a closed-loop control mode runs, the
    drive shall send one such frame per window, a window being the whole number of control
    periods nearest to one period of the configured telemetry rate. The rate shall accept 0,
    which stops the stream, to 1000 Hz; a larger rate shall be answered with invalidPayload and
    change nothing. Every window the control loop closes shall take the next sequence number,
    so that a window the drive could not send appears to the client as a gap in the sequence.
