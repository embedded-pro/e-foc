- id: REQ-CTRL-001
  title: Runtime algorithm selection
  shall: >
    The system shall allow selection of the active control algorithm for each FOC
    loop (current, speed, and position) at runtime via the CLI, without requiring
    a firmware update or restart.

- id: REQ-CTRL-002
  title: Algorithm selection permitted only when motor is stopped
  shall: >
    Algorithm selection shall only be permitted when the motor is stopped, defined
    as not being in the Enabled state (i.e., the FOC controller is not actively
    driving the inverter). Any algorithm selection request received while the motor
    is running shall be rejected without altering the active algorithm, the
    controller internal state, or any NVM record.

- id: REQ-CTRL-003
  title: NACK response on rejected algorithm selection
  shall: >
    When an algorithm selection request is rejected because the motor is not stopped,
    the system shall respond with a negative acknowledgment on the interface
    through which the request was received. A CLI select command shall print an
    error indicating the motor must be stopped before changing the algorithm. The
    response shall be delivered before any subsequent command is processed on that
    interface.

- id: REQ-CTRL-004
  title: Heap-free algorithm storage
  shall: >
    All concrete controller algorithm instances shall be stored in fixed-size,
    statically-allocated in-place storage. No dynamic memory allocation shall
    occur during algorithm selection, construction, configuration, or per-sample
    computation.

- id: REQ-CTRL-005
  title: Zero virtual-dispatch hot-path overhead
  shall: >
    The per-sample dispatch to the active controller algorithm within the 20 kHz
    FOC interrupt context shall not use virtual function call overhead through a
    base-class pointer. The dispatch mechanism shall allow the compiler to inline
    and optimise the arithmetic of each concrete controller at its call site.

- id: REQ-CTRL-006
  title: NVM algorithm persistence
  shall: >
    The active algorithm identifier for each of the three control loops shall be
    persisted to non-volatile memory upon each successful selection. On the next
    power cycle, the persisted identifiers shall be restored and the corresponding
    controllers shall be configured before the first Enable command is accepted.

- id: REQ-CTRL-007
  title: Motor model parameter propagation
  shall: >
    Upon each algorithm selection, the system shall configure the newly selected
    controller with the most recent motor model parameter snapshot available from
    the online RLS estimators before the controller becomes active. The ISR shall
    not execute the new controller until configuration and reset are complete.

- id: REQ-CTRL-008
  title: Minimum selectable algorithm set — current loop
  shall: >
    The current control loop shall support at least the following selectable
    algorithms, each valid only for the current loop: incremental PID, decoupled
    PID with cross-coupling and back-EMF feedforward, one-step and two-step
    deadbeat predictive control, and sliding-mode control with boundary-layer
    saturation. All shall be selectable at runtime without recompilation.

- id: REQ-CTRL-009
  title: Minimum selectable algorithm set — speed loop
  shall: >
    The speed control loop shall support at least the following selectable
    algorithms, each valid only for the speed loop: incremental PID, LQI
    state-feedback with DARE-computed gains, Active Disturbance Rejection Control
    (ADRC) with Extended State Observer, and two-degree-of-freedom (Two-DOF) PI
    with independent reference pre-filter. All shall be selectable at runtime
    without recompilation.

- id: REQ-CTRL-010
  title: Minimum selectable algorithm set — position loop
  shall: >
    The position control loop shall support at least the following selectable
    algorithms, each valid only for the position loop: incremental PID, cascade
    proportional position controller (Cascade P) that outputs a speed reference
    to the speed loop, LQR state-feedback with DARE-computed gains, LQI with
    position integral augmentation, and two-degree-of-freedom position control
    (Two-DOF). All shall be selectable at runtime without recompilation.

- id: REQ-CTRL-011
  title: Controller reset on selection
  shall: >
    When a new algorithm is selected and constructed in place, its internal state
    (integrators, observer states, learned corrections, previous-sample memories)
    shall be reset to zero before the controller becomes active. This shall apply
    even if the same algorithm type is re-selected.

- id: REQ-CTRL-012
  title: Mechanical parameter availability guard
  shall: >
    Selection of any speed or position algorithm that requires mechanical parameters
    (LQI, ADRC, LQR for speed; LQR, LQI for position) shall be rejected with an
    InvalidParameters result code if the mechanical RLS identification has not been
    completed and valid estimates of J and Bf are not available. PID, Two-DOF and
    Cascade P do not require mechanical RLS and shall remain selectable before
    mechanical identification.

- id: REQ-CTRL-013
  title: Active algorithm query
  shall: >
    The system shall provide a query interface to read the currently active
    algorithm identifier for each control loop. This query shall be available
    via the CLI (active_algorithms command) and shall reflect the algorithm that
    is currently dispatched in the ISR, not the value most recently requested or
    persisted.
