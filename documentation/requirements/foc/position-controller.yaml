- id: REQ-POS-001
  title: Position cascade architecture
  shall: >
    The position controller shall execute an outer position loop at 1 kHz above an
    inner current loop running at 20 kHz. The velocity loop shall be interposed
    between them only when the active position law emits a speed reference; a
    position law that emits a current reference shall drive the current loop
    directly, bypassing the velocity loop.

- id: REQ-POS-002
  title: Position setpoint acceptance
  shall: >
    The position controller shall accept a target rotor position expressed in
    mechanical radians as the primary control setpoint.

- id: REQ-POS-003
  title: Independent bandwidth-based tuning per cascade stage
  shall: >
    The current loop, the velocity loop, and the position loop shall each be tuned
    through their own closed-loop bandwidth together with the weights specific to the
    active law, configurable independently of one another. Each loop shall derive its
    gains from that bandwidth and the identified motor model rather than from
    externally supplied per-axis proportional, integral, and derivative gains.

- id: REQ-POS-004
  title: Position loop bandwidth with anti-windup
  shall: >
    The position controller shall accept a closed-loop bandwidth for the outer position
    loop and apply it to the active position control law. Every position control law
    that accumulates an integral state shall bound that state whenever the commanded
    output saturates, so that the accumulated term cannot grow while the output is
    limited.

- id: REQ-POS-005
  title: FOC loop CPU budget
  shall: >
    The complete position control cycle, including sensing, transforms, the active
    current law, and PWM output, shall execute at a 20 kHz inner loop rate and shall
    not exceed 4500 cycles at 120 MHz, which is 75 percent of the available CPU time
    per control period.

- id: REQ-POS-006
  title: Runtime-selectable position control law
  shall: >
    The position controller shall dispatch the per-sample position computation to one
    of a fixed set of control laws selected at runtime. All laws shall reside
    simultaneously in fixed-size storage held by a variant, and neither selection nor
    per-sample dispatch shall perform any dynamic memory allocation. Each law shall
    declare whether its output is a speed reference or a current reference.

- id: REQ-POS-007
  title: Position tuning rejection when the design is infeasible
  shall: >
    A request to change the position loop tunings shall be rejected while the motor is
    enabled, and shall also be rejected when the active position law cannot be designed
    for the requested tunings. In either case the previously accepted tunings shall
    remain active.

- id: REQ-POS-008
  title: A position law with no actuator authority commands nothing and accumulates nothing
  shall: >
    When a state-feedback position law holds a design its solver could not produce, so that its
    command is zero for every state, the controller shall command zero current and shall not
    advance its integral state. The saturation guard that unwinds the integral compares the limited
    command against the unlimited one, and with such a design the two are equal for every input, so
    the guard cannot fire.
