# Retired, not reused:
#   REQ-POS-005: the inner-loop budget is REQ-PERF-001

- id: REQ-POS-001
  title: Position cascade architecture
  shall: >
    The position controller shall execute an outer position loop at 1 kHz above an
    inner current loop running at 20 kHz. The velocity loop shall be interposed
    between them only when the active position law emits a speed reference; a
    position law that emits a current reference shall drive the current loop
    directly, bypassing the velocity loop.

- id: REQ-POS-002
  title: Position setpoint acceptance
  shall: >
    The position controller shall accept a target rotor position expressed in
    mechanical radians as the primary control setpoint.

- id: REQ-POS-003
  title: Independent bandwidth-based tuning per cascade stage
  shall: >
    The current loop, the velocity loop, and the position loop shall each be tuned
    through their own closed-loop bandwidth together with the weights specific to the
    active law, configurable independently of one another. Each loop shall derive its
    gains from that bandwidth and the identified motor model rather than from
    externally supplied per-axis proportional, integral, and derivative gains.

- id: REQ-POS-004
  title: Position loop bandwidth with anti-windup
  shall: >
    The position controller shall accept a closed-loop bandwidth for the outer position
    loop and apply it to the active position control law. Every position control law
    that accumulates an integral state shall bound that state whenever the commanded
    output saturates, so that the accumulated term cannot grow while the output is
    limited.

- id: REQ-POS-006
  title: Runtime-selectable position control law
  shall: >
    The position controller shall dispatch the per-sample position computation to one
    of a fixed set of control laws selected at runtime. All laws shall reside
    simultaneously in fixed-size storage held by a variant, and neither selection nor
    per-sample dispatch shall perform any dynamic memory allocation. Each law shall
    declare whether its output is a speed reference or a current reference.

- id: REQ-POS-007
  title: Position tuning rejection when the design is infeasible
  shall: >
    A request to change the position loop tunings shall be rejected while the motor is
    enabled, and shall also be rejected when the active position law cannot be designed
    for the requested tunings. In either case the previously accepted tunings shall
    remain active.

- id: REQ-POS-008
  title: A position law with no actuator authority commands nothing and accumulates nothing
  shall: >
    When a state-feedback position law holds a design its solver could not produce, so that its
    command is zero for every state, the controller shall command zero current and shall not advance
    its integral state.
  rationale: >
    The saturation guard that unwinds the integral compares the limited command against the
    unlimited one, and with such a design the two are equal for every input, so the guard cannot
    fire.

- id: REQ-POS-009
  title: Position step-response envelope
  status: verified
  verification: [sil, mil]
  shall: >
    With the nominal plant (the Teknic M-2310P-LN-04K reference motor) and the default loop
    bandwidths, every position control law shall move the rotor from rest to a 1.5 rad setpoint, and
    from there to -1.5 rad while holding, and enter and then stay inside a 10 percent band of the
    step within a settling time and with an overshoot, a steady-state error, a rise time from a
    tenth to nine tenths of the step and a tail band over the last quarter of the window, as a
    percentage of that step rather than of the setpoint it ends at, no worse than its row. From
    rest, as settling time, overshoot, error, rise time and tail band: PID 200 ms, 15 percent, 0.1
    rad, 185 ms, 8 percent; cascade P 200 ms, 10 percent, 0.02 rad, 210 ms, 1 percent; LQR 60 ms, 15
    percent, 0.01 rad, 30 ms, 1 percent; LQI 60 ms, 50 percent, 0.01 rad, 10 ms, 1 percent; two-DOF
    300 ms, 15 percent, 0.1 rad, 310 ms, 8 percent. On the change to -1.5 rad: PID 200 ms, 15
    percent, 0.15 rad, 195 ms, 6 percent; cascade P 200 ms, 10 percent, 0.02 rad, 210 ms, 1 percent;
    LQR 60 ms, 15 percent, 0.01 rad, 30 ms, 1 percent; LQI 60 ms, 40 percent, 0.01 rad, 15 ms, 1
    percent; two-DOF 300 ms, 15 percent, 0.15 rad, 320 ms, 6 percent. The response is measured on
    the plant's own trajectory on the control-tick time base.
  rationale: >
    Each rise and tail bound is twice the worst value repeated runs of its row measured, rounded up
    to the figure the row carries; the row fails when a measurement exceeds that figure, and the
    margin keeps the spread between one run and the next from reaching it. The rows are pinned in
    integration_tests/features/control_performance.feature (PID) and
    integration_tests/model_in_the_loop/test/TestControlPerformance.cpp (every law).

- id: REQ-POS-010
  title: Position hold against a shaft torque step
  status: verified
  verification: [sil, mil]
  shall: >
    While holding 1.5 rad against the nominal plant, every position control law shall keep the
    rotor within 0.1 rad of the setpoint when a 0.002 N·m shaft torque is applied as a step, and
    within 50 ms of the step shall return the rotor to within 0.08 rad of the setpoint and hold
    it there. The LQI law, which carries integral action on the position error, shall hold within
    0.05 rad and return to within 0.02 rad.

- id: REQ-POS-011
  title: Position hold against cogging and dry friction
  status: verified
  verification: sil
  shall: >
    Against the bench plant with the bench's cogging (24 detents a revolution, 4 mN·m deep) and
    dry friction (3.7 mN·m), after the full calibration, every position control law shall settle
    within 0.03 rad of a 1.0 rad setpoint within 4 s and stay there for 2 s, and then do the same
    at -1.0 rad. A law that integrates the position error shall not wind its integral while the
    rotor stands still: a stationary rotor is asked for the speed its error alone calls for.

- id: REQ-POS-012
  title: Position hold on a cogging hill top with the cogging map applied
  status: verified
  verification: sil
  shall: >
    With a cogging map in the calibration record, the speed and position cascades shall add the
    map's torque at the rotor's electrical angle, over the torque constant, to the quadrature
    current they ask for, and the online mechanical estimator shall regress on the current without
    that addition. Against the bench plant with the bench's cogging and dry friction, after the
    full calibration, every position control law shall settle within 0.03 rad of a 3.0 rad
    setpoint, which sits where the cogging pushes the rotor away, within 4 s and hold it for 2 s,
    and then do the same at 1.0 rad.

- id: REQ-POS-013
  title: Measured position within half a turn of the alignment zero on every target
  status: verified
  verification: hil
  shall: >
    The measured rotor position, which the position loop compares with its setpoint and the CAN
    telemetry reports, shall be the mechanical angle from the zero the alignment set, wrapped to
    [-pi, pi) on every target whatever that zero is, so that a rotor settled on a setpoint within
    half a turn of the zero reports that setpoint.
