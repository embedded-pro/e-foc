- id: REQ-SPD-001
  title: Speed cascade architecture
  shall: >
    The speed controller shall implement a cascade control architecture with an outer
    velocity loop executing at 1 kHz and an inner current loop executing at 20 kHz.

- id: REQ-SPD-002
  title: Speed setpoint acceptance
  shall: >
    The speed controller shall accept a target velocity expressed in radians per second
    as the primary control setpoint.

- id: REQ-SPD-003
  title: Independent bandwidth-based tuning per loop
  shall: >
    The current loop and the velocity loop shall each be tuned through their own
    closed-loop bandwidth together with the weights specific to the active law,
    configurable independently of one another. Each loop shall derive its gains from
    that bandwidth and the identified motor model rather than from externally supplied
    per-axis proportional, integral, and derivative gains.

- id: REQ-SPD-004
  title: Velocity loop bandwidth with anti-windup
  shall: >
    The speed controller shall accept a closed-loop bandwidth for the outer velocity
    loop and apply it to the active velocity control law. Every velocity control law
    that accumulates an integral state shall bound that state whenever the commanded
    current saturates, so that the accumulated term cannot grow while the output is
    limited.

- id: REQ-SPD-005
  title: Outer loop frequency reporting
  shall: >
    The speed controller shall expose the configured outer loop frequency so that
    higher-level services can query the effective velocity control rate.

- id: REQ-SPD-006
  title: FOC loop CPU budget
  shall: >
    The complete speed control cycle, including sensing, transforms, the active current
    law, and PWM output, shall execute at a 20 kHz inner loop rate and shall not exceed
    4500 cycles at 120 MHz, which is 75 percent of the available CPU time per control
    period.

- id: REQ-SPD-007
  title: Runtime-selectable speed control law
  shall: >
    The speed controller shall dispatch the per-sample velocity computation to one of a
    fixed set of control laws selected at runtime. All laws shall reside simultaneously
    in fixed-size storage held by a variant, and neither selection nor per-sample
    dispatch shall perform any dynamic memory allocation.
