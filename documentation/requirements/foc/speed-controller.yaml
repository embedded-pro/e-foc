# Retired, not reused:
#   REQ-SPD-006: the inner-loop budget is REQ-PERF-001

- id: REQ-SPD-001
  title: Speed cascade architecture
  shall: >
    The speed controller shall implement a cascade control architecture with an outer
    velocity loop executing at 1 kHz and an inner current loop executing at 20 kHz.

- id: REQ-SPD-002
  title: Speed setpoint acceptance
  shall: >
    The speed controller shall accept a target velocity expressed in radians per second
    as the primary control setpoint.

- id: REQ-SPD-003
  title: Independent bandwidth-based tuning per loop
  shall: >
    The current loop and the velocity loop shall each be tuned through their own
    closed-loop bandwidth together with the weights specific to the active law,
    configurable independently of one another. Each loop shall derive its gains from
    that bandwidth and the identified motor model rather than from externally supplied
    per-axis proportional, integral, and derivative gains.

- id: REQ-SPD-004
  title: Velocity loop bandwidth with anti-windup
  shall: >
    The speed controller shall accept a closed-loop bandwidth for the outer velocity
    loop and apply it to the active velocity control law. Every velocity control law
    that accumulates an integral state shall bound that state whenever the commanded
    current saturates, so that the accumulated term cannot grow while the output is
    limited.

- id: REQ-SPD-005
  title: Outer loop frequency reporting
  shall: >
    The speed controller shall expose the configured outer loop frequency so that
    higher-level services can query the effective velocity control rate.

- id: REQ-SPD-007
  title: Runtime-selectable speed control law
  shall: >
    The speed controller shall dispatch the per-sample velocity computation to one of a
    fixed set of control laws selected at runtime. All laws shall reside simultaneously
    in fixed-size storage held by a variant, and neither selection nor per-sample
    dispatch shall perform any dynamic memory allocation.

- id: REQ-SPD-008
  title: Speed step-response envelope
  status: verified
  verification: [sil, mil]
  shall: >
    With the nominal plant (the Teknic M-2310P-LN-04K reference motor) and the default loop
    bandwidths, every speed control law shall bring the mechanical speed from rest to a 20 rad/s
    setpoint with the mean of the last quarter of a 500 ms window within 0.5 rad/s of the setpoint,
    and shall enter and then stay inside a 10 percent band of the step within a settling time and
    with an overshoot no worse than its row, with a rise time from a tenth to nine tenths of the
    step and a tail band over the last quarter of the window, as a percentage of that step rather
    than of the setpoint it ends at, no worse than its row. From rest, as settling time, overshoot,
    rise time and tail band: PI 60 ms, 15 percent, 20 ms, 6 percent; ADRC 80 ms, 15 percent, 50 ms,
    6 percent; two-DOF 60 ms, 15 percent, 30 ms, 6 percent; LQI 60 ms, 15 percent, 25 ms, 6 percent.
    A setpoint changed while running shall meet the same settling time, overshoot and 0.5 rad/s
    error, with rise time and tail band, for a change to 40 rad/s: PI 25 ms, 5 percent; ADRC 50 ms,
    6 percent; two-DOF 40 ms, 6 percent; LQI 35 ms, 6 percent; and for a change to -20 rad/s: PI 20
    ms, 4 percent; ADRC 40 ms, 4 percent; two-DOF 30 ms, 4 percent; LQI 30 ms, 4 percent. The
    response is measured on the plant's own trajectory on the control-tick time base.
  rationale: >
    Each rise and tail bound is twice the worst value repeated runs of its row measured, rounded up
    to the figure the row carries; the row fails when a measurement exceeds that figure, and the
    margin keeps the spread between one run and the next from reaching it. The rows are pinned in
    integration_tests/features/control_performance.feature (PI) and
    integration_tests/model_in_the_loop/test/TestControlPerformance.cpp (every law).

- id: REQ-SPD-009
  title: Speed-loop rejection of a shaft torque step
  status: verified
  verification: [sil, mil]
  shall: >
    While regulating 20 rad/s against the nominal plant, every speed control law shall keep the
    speed within 4 rad/s of the setpoint when a 0.002 N·m shaft torque is applied as a step, and
    within 50 ms of the step shall return the speed to within 2 rad/s of the setpoint and hold
    the mean of the window inside that band. The envelope shall hold for a torque of
    either sign, since a disturbance that assists the rotor unwinds the loop as surely as one
    that opposes it. Where the step demands more current than the drive is allowed to deliver,
    every law shall still return to its setpoint once the steady-state demand fits inside the
    limit again, so that a recovery running through a saturated command unwinds rather than
    latching the integrator: against a 0.5 N·m step, which asks for about thirteen of the twenty
    amperes allowed, the speed shall stay within 300 rad/s of the setpoint and return to within
    3 rad/s of it within 350 ms.
  rationale: >
    The 0.002 N·m step is 0.73 percent of the 0.274 N·m rated torque of the Teknic M-2310P-LN-04K
    (documentation/theory/foc-plant-models.md, Reference motors); it is small on purpose, so that the loop
    stays out of current saturation and the numbers measure the control law rather than the current limit.
    The 0.5 N·m step is 182 percent of that rated torque.

- id: REQ-SPD-010
  title: Speed acceleration and deceleration ramps
  status: verified
  verification: [sil, mil]
  shall: >
    The drive shall hold a speed acceleration and a speed deceleration in the configuration
    record, each settable from 0 to 100000 rad/s² with 0, the default, meaning no limit, in force
    from the next outer-loop period in any state. In speed mode the speed reference shall move
    towards the operator's setpoint by at most the acceleration per second while its magnitude
    grows and by at most the deceleration per second while it shrinks, a reversal decelerating
    to zero before it accelerates; a reference starts from zero at every Enable. A speed command
    of a calibration step shall not be ramped. At 100 rad/s², a step of the setpoint from 0 to
    20 rad/s shall bring the speed within 0.5 rad/s of 20 rad/s in 200 ms ± 10 % with an
    overshoot below 3.5 %, for every speed control law.
  rationale: >
    The laws follow the ramp with a lag and no acceleration feed-forward, so the integrating laws
    carry the ramp's effort in their integrator and overshoot when the ramp ends: 2.7 % under the
    PI and 2.2 % under the two-DOF law on the nominal plant, below 1 % under LQI and ADRC
    (integration_tests/model_in_the_loop/test/TestDriveLimits.cpp). The 3.5 % bound leaves a
    margin above the worst.
