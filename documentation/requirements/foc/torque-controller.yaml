# Retired, not reused:
#   REQ-TRQ-005: the inner-loop budget is REQ-PERF-001

- id: REQ-TRQ-001
  title: Runtime-selectable current control law
  shall: >
    The torque controller shall dispatch the per-sample current control computation
    to one of a fixed set of control laws selected at runtime. All laws shall reside
    simultaneously in fixed-size storage held by a variant, and neither selection nor
    per-sample dispatch shall perform any dynamic memory allocation.

- id: REQ-TRQ-002
  title: Independent Id and Iq setpoints
  shall: >
    The torque controller shall accept d-axis current (Id) and q-axis current (Iq)
    as independent inputs. Both setpoints shall be injectable into the controller and
    regulated by the active current control law within a single per-sample computation.

- id: REQ-TRQ-003
  title: Bandwidth-based current loop tuning
  shall: >
    The current loop shall be tuned through a single closed-loop bandwidth together
    with the weights specific to the active law, and shall derive its own gains from
    that bandwidth and the identified motor model. The controller shall not require
    per-axis proportional, integral, and derivative gains to be supplied externally.

- id: REQ-TRQ-004
  title: Anti-windup on integrating current laws
  shall: >
    Every current control law that accumulates an integral state shall bound that
    state whenever the commanded voltage saturates, so that the accumulated term
    cannot grow while the output is limited.

- id: REQ-TRQ-006
  title: The torque current reference is bounded by the inverter envelope
  shall: >
    The torque cascade shall bound each current setpoint it accepts to the inverter's maximum
    supported current before that setpoint reaches the current loop. The bound shall apply to the
    magnitude of the (Id, Iq) vector rather than to either axis on its own, and a setpoint outside
    the envelope shall be scaled onto it so that the commanded ratio between the axes is preserved.

- id: REQ-TRQ-007
  title: Current step-response envelope
  status: verified
  verification: [sil, mil]
  shall: >
    With the nominal plant (the Teknic M-2310P-LN-04K reference motor) and the default current-loop
    bandwidth, every current control law shall bring the q-axis current from zero to a 0.5 A
    setpoint, measured on the plant's own q-axis current at the control rate, and shall meet its row
    below. Each row gives the band, as a percentage of the step, the response enters and then stays
    inside within the settling time; the overshoot limit; the rise time from a tenth to nine tenths
    of the step; the band the tail still ripples in over the last quarter of the window, as a
    percentage of that step rather than of the setpoint it ends at; and the steady-state error
    limit. PI: 25 percent band within 3 ms, overshoot below 30 percent, rise within 15 ms, tail
    within 35 percent, error below 0.12 A. Decoupled PID: 10 percent within 3 ms, below 30 percent,
    rise within 4 ms, tail within 1 percent, error below 0.05 A. Deadbeat: 10 percent within 1 ms,
    below 30 percent, rise within 1 ms, tail within 7 percent, error below 0.05 A. Sliding mode: 10
    percent within 3 ms, below 30 percent, rise within 1 ms, tail within 13 percent, error below
    0.05 A. A PI setpoint change from 0.5 A to -0.5 A while running shall settle into a 40 percent
    band within 12 ms with overshoot below 30 percent, rise within 6 ms, tail within 65 percent and
    error below 0.2 A.
  rationale: >
    The PI law is held to a wider band and error because, without back-EMF feedforward, it follows
    the ramping back-EMF of a free rotor with a standing error of the ramp rate over its integral
    gain, which no duty resolution removes. Each rise and tail bound is twice the worst value
    repeated runs of its row measured, rounded up to the figure the row carries; the row fails when
    a measurement exceeds that figure, and the margin keeps the spread between one run and the next
    from reaching it. The rows are pinned in integration_tests/features/control_performance.feature
    and integration_tests/model_in_the_loop/test/TestControlPerformance.cpp.

- id: REQ-TRQ-008
  title: The bridge's dead-time loss is compensated
  status: verified
  verification: sil
  shall: >
    On a board whose bridge has a dead-time loss measured at the dead band the drive runs, every
    duty the drive commands shall be raised on a leg whose current flows out of it and lowered on
    a leg whose current flows into it, by the effective dead time over the PWM period once the
    current is past the measured knee and in proportion to the current below it, with the result
    held within the period. A board with no loss measured at that dead band shall receive its
    duties unchanged. Through the bench's power stage, whose loss reads the online resistance
    about 18 % high when uncompensated, the online resistance estimate shall be within 5 % of
    the plant's once the drive compensates with the bench's measured loss, also when the
    currents are read through the bench's current-sense chain.

- id: REQ-TRQ-009
  title: Two readable phases give the third phase's current
  status: verified
  verification: sil
  shall: >
    On a board that reads its phases through low-side shunts, the platform shall keep the middle
    of the three duties within the board's readable limit, moving all three together where that
    keeps the line-to-line voltages, and shall let the highest duty go up to the board's maximum
    duty. A phase whose duty was above the readable limit in the period that ends at the sample
    or in the one that starts there shall have its current given as the negative sum of the other
    two. Only a vector whose middle duty, or whose highest duty, would still be above its limit
    shall be scaled down, along its own direction. Through the bench's current-sense chain, with
    the board's 70 % readable limit and 95 % maximum duty, the bench motor shall hold a speed
    setpoint of 400 rad/s within 0.5 rad/s, where keeping all three phases readable stops it
    near 356 rad/s.

- id: REQ-TRQ-010
  title: The deadbeat law accounts for a duty that acts a period late
  status: verified
  verification: sil
  shall: >
    On a board that applies each duty a PWM period after it is computed, the deadbeat current law
    shall act on the current it predicts for the period its duty lands in, from the measured
    current and the voltage still in flight after the modulation limit. On the bench motor with
    each duty applied a period late, the deadbeat law shall bring the q-axis current from zero to
    a 0.5 A setpoint and enter and then stay inside a 10 percent band within 1 ms, with an
    overshoot below 30 percent and its tail within 16 percent of the step, where acting on the
    measured current overshoots by about 100 percent and takes over 12 ms to settle.
  rationale: >
    The tail bound is twice the worst tail band repeated runs measured, rounded up: 7.86 percent
    on CI, against 3.8 to 6.7 percent over twenty local runs. The tail band moves from run to run
    because the tick the enable lands on does (software-in-the-loop.md Part I).

- id: REQ-TRQ-011
  title: The deadbeat law removes a voltage error its model does not account for
  status: verified
  verification: sil
  shall: >
    The deadbeat current law shall estimate the voltage its model does not account for from the
    difference between each measured current and the current it predicted for that sample, at the
    current loop's bandwidth, and shall subtract that estimate from its command, starting afresh
    whenever the loop is reset. On the bench motor with each duty applied a period late and a stored
    flux linkage 1.5 times the motor's, after 120 ms at 0.5 A the deadbeat law shall bring the
    q-axis current to a 0 A setpoint and enter and then stay inside a 10 percent band within 1 ms,
    with an overshoot below 30 percent, its tail within 16 percent of the step and a steady-state
    error below 0.02 A, where without the estimate the current stays near 0.39 A and keeps the
    rotor accelerating.
  rationale: >
    The tail bound is twice the worst tail band repeated runs of REQ-TRQ-010 and of this
    requirement measured, rounded up: 7.86 percent on CI for the step from rest, and 7.38 percent
    on CI for this one, against 3.5 to 5.8 percent over twenty local runs. Both use the same law on
    the same plant, so they carry one bound (software-in-the-loop.md Part I).

- id: REQ-TRQ-012
  title: Cogging compensation in torque mode
  status: verified
  verification: [sil, mil, unit]
  shall: >
    When the calibration record holds a cogging map and the torque constant is known, the torque
    mode shall add, at every control interrupt, the map's current at the rotor's electrical angle
    to the operator's q-axis setpoint after the speed limiter, and shall hold the sum within the
    current limit. The demand the drive reports shall stay the operator's command. A current
    command of a calibration step shall not be compensated, and a new calibration shall clear the
    map before it identifies the motor. On the bench plant, with the map the full calibration
    measured, a torque command of 0.12 A, above the shaft's dry friction but below the dry
    friction and the cogging together, shall turn the rotor through at least one revolution in
    2 s; without a map the same command shall leave it in a detent.
  rationale: >
    At 0.12 A the bench motor's 5.0 mN·m clears the 3.7 mN·m of dry friction but not the 7.7 mN·m
    of dry friction and cogging together. A larger command lets the current-sense noise of the
    emulated board shake an uncompensated rotor out of its detents, so it no longer tells the two
    apart. The SIL scenario read 61.8 rad with the map and 0.010 rad without.

- id: REQ-TRQ-013
  title: The duties follow the measured bus voltage
  status: draft
  verification: [sil, unit]
  shall: >
    In every control mode, the current law's gains, its feed-forwards and the reported q-axis
    voltage shall stay those of the bus voltage the motor model was configured with. Once a bus
    voltage is measured, the cascade shall divide every per-unit voltage the law commands by the
    ratio r of the measured to the configured bus voltage before modulating it, and shall limit
    the law's output to a magnitude of r instead of 1, with r held within 0.5 to 2. A new
    measurement shall be in force from the next control period, also while Enabled, and with no
    measurement r shall be 1.
