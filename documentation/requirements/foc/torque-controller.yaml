- id: REQ-TRQ-001
  title: Runtime-selectable current control law
  shall: >
    The torque controller shall dispatch the per-sample current control computation
    to one of a fixed set of control laws selected at runtime. All laws shall reside
    simultaneously in fixed-size storage held by a variant, and neither selection nor
    per-sample dispatch shall perform any dynamic memory allocation.

- id: REQ-TRQ-002
  title: Independent Id and Iq setpoints
  shall: >
    The torque controller shall accept d-axis current (Id) and q-axis current (Iq)
    as independent inputs. Both setpoints shall be injectable into the controller and
    regulated by the active current control law within a single per-sample computation.

- id: REQ-TRQ-003
  title: Bandwidth-based current loop tuning
  shall: >
    The current loop shall be tuned through a single closed-loop bandwidth together
    with the weights specific to the active law, and shall derive its own gains from
    that bandwidth and the identified motor model. The controller shall not require
    per-axis proportional, integral, and derivative gains to be supplied externally.

- id: REQ-TRQ-004
  title: Anti-windup on integrating current laws
  shall: >
    Every current control law that accumulates an integral state shall bound that
    state whenever the commanded voltage saturates, so that the accumulated term
    cannot grow while the output is limited.

- id: REQ-TRQ-005
  title: ISR execution budget
  shall: >
    The complete torque control cycle (sensing, transforms, active current law,
    space vector modulation, output) shall execute at a 20 kHz control rate and
    shall not exceed 4500 cycles at 120 MHz, which is 75 percent of the available
    CPU time per control period.

- id: REQ-TRQ-006
  title: The torque current reference is bounded by the inverter envelope
  shall: >
    The torque cascade shall bound each current setpoint it accepts to the inverter's maximum
    supported current before that setpoint reaches the current loop. The bound shall apply to the
    magnitude of the (Id, Iq) vector rather than to either axis on its own, and a setpoint outside
    the envelope shall be scaled onto it so that the commanded ratio between the axes is preserved.

- id: REQ-TRQ-007
  title: Current step-response envelope
  shall: >
    With the nominal plant (the Teknic M-2310P-LN-04K reference motor) and the default
    current-loop bandwidth, every current control law shall bring the q-axis current from zero to
    a 0.5 A setpoint and enter and then stay inside a 40 percent band of the step within 12 ms
    for PI and the decoupled law and 5 ms for deadbeat and sliding mode, with an overshoot below
    20 percent for PI and deadbeat, 40 percent for the decoupled law and 70 percent for sliding
    mode, and a steady-state error below 0.1 A, measured on the plant's own q-axis current at the
    control rate. The band is as wide as it is because the duty reaches the
    inverter in whole percent and the current ripples by about a tenth of an ampere around the
    setpoint; the envelope the laws should meet, a 10 percent band within 3 ms (1 ms for
    deadbeat) with 30 percent overshoot and 0.05 A error, is held out of the default run until
    the duty carries more resolution. Each law's rise time from a tenth to nine tenths of the
    step, and the band its tail still ripples in over the last quarter of the window, measured as
    a percentage of that step rather than of the setpoint it ends at, shall also
    be bounded by the row it carries; each of those bounds is twice the worst value
    repeated runs of its row measured, rounded up, so that a rise time or a ripple which doubles
    fails while the spread between one run and the next does not.
