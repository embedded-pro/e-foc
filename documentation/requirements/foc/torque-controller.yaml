- id: REQ-TRQ-001
  title: Runtime-selectable current control law
  shall: >
    The torque controller shall dispatch the per-sample current control computation
    to one of a fixed set of control laws selected at runtime. All laws shall reside
    simultaneously in fixed-size storage held by a variant, and neither selection nor
    per-sample dispatch shall perform any dynamic memory allocation.

- id: REQ-TRQ-002
  title: Independent Id and Iq setpoints
  shall: >
    The torque controller shall accept d-axis current (Id) and q-axis current (Iq)
    as independent inputs. Both setpoints shall be injectable into the controller and
    regulated by the active current control law within a single per-sample computation.

- id: REQ-TRQ-003
  title: Bandwidth-based current loop tuning
  shall: >
    The current loop shall be tuned through a single closed-loop bandwidth together
    with the weights specific to the active law, and shall derive its own gains from
    that bandwidth and the identified motor model. The controller shall not require
    per-axis proportional, integral, and derivative gains to be supplied externally.

- id: REQ-TRQ-004
  title: Anti-windup on integrating current laws
  shall: >
    Every current control law that accumulates an integral state shall bound that
    state whenever the commanded voltage saturates, so that the accumulated term
    cannot grow while the output is limited.

- id: REQ-TRQ-005
  title: ISR execution budget
  shall: >
    The complete torque control cycle (sensing, transforms, active current law,
    space vector modulation, output) shall execute at a 20 kHz control rate and
    shall not exceed 4500 cycles at 120 MHz, which is 75 percent of the available
    CPU time per control period.

- id: REQ-TRQ-006
  title: The torque current reference is bounded by the inverter envelope
  shall: >
    The torque cascade shall bound each current setpoint it accepts to the inverter's maximum
    supported current before that setpoint reaches the current loop. The bound shall apply to the
    magnitude of the (Id, Iq) vector rather than to either axis on its own, and a setpoint outside
    the envelope shall be scaled onto it so that the commanded ratio between the axes is preserved.

- id: REQ-TRQ-007
  title: Current step-response envelope
  shall: >
    With the nominal plant (the Teknic M-2310P-LN-04K reference motor) and the default
    current-loop bandwidth, every current control law shall bring the q-axis current from zero to
    a 0.5 A setpoint and enter and then stay inside a 10 percent band of the step within 3 ms
    (1 ms for deadbeat) with an overshoot below 30 percent and a steady-state error below
    0.05 A, measured on the plant's own q-axis current at the control rate. The PI law is held to
    a 25 percent band and 0.12 A instead: without back-EMF feedforward it follows the ramping
    back-EMF of a free rotor with a standing error of the ramp rate over its integral gain, which
    no duty resolution removes. Each law's rise time from a tenth to nine tenths of the
    step, and the band its tail still ripples in over the last quarter of the window, measured as
    a percentage of that step rather than of the setpoint it ends at, shall also
    be bounded by the row it carries. Each of those bounds is set at twice the worst
    value repeated runs of its row measured, rounded up to the figure the row carries, and the row
    fails when a measurement exceeds that figure; the margin is there so that the spread between
    one run and the next cannot reach it.

- id: REQ-TRQ-008
  title: The bridge's dead-time loss is compensated
  shall: >
    On a board whose bridge has a dead-time loss measured at the dead band the drive runs, every
    duty the drive commands shall be raised on a leg whose current flows out of it and lowered on
    a leg whose current flows into it, by the effective dead time over the PWM period once the
    current is past the measured knee and in proportion to the current below it, with the result
    held within the period. A board with no loss measured at that dead band shall receive its
    duties unchanged. Through the bench's power stage, whose loss reads the online resistance
    about 18 % high when uncompensated, the online resistance estimate shall be within 5 % of
    the plant's once the drive compensates with the bench's measured loss, also when the
    currents are read through the bench's current-sense chain.

- id: REQ-TRQ-009
  title: Two readable phases give the third phase's current
  shall: >
    On a board that reads its phases through low-side shunts, the platform shall keep the middle
    of the three duties within the board's readable limit, moving all three together where that
    keeps the line-to-line voltages, and shall let the highest duty go up to the board's maximum
    duty. A phase whose duty was above the readable limit in the period that ends at the sample
    or in the one that starts there shall have its current given as the negative sum of the other
    two. Only a vector whose middle duty, or whose highest duty, would still be above its limit
    shall be scaled down, along its own direction. Through the bench's current-sense chain, with
    the board's 70 % readable limit and 95 % maximum duty, the bench motor shall hold a speed
    setpoint of 400 rad/s within 0.5 rad/s, where keeping all three phases readable stops it
    near 356 rad/s.

- id: REQ-TRQ-010
  title: The deadbeat law accounts for a duty that acts a period late
  shall: >
    On a board that applies each duty a PWM period after it is computed, the deadbeat current law
    shall act on the current it predicts for the period its duty lands in, from the measured
    current and the voltage still in flight after the modulation limit. On the bench motor with
    each duty applied a period late, the deadbeat law shall bring the q-axis current from zero to
    a 0.5 A setpoint and enter and then stay inside a 10 percent band within 1 ms, with an
    overshoot below 30 percent and its tail within 7 percent of the step, where acting on the
    measured current overshoots by about 100 percent and takes over 12 ms to settle.

- id: REQ-TRQ-011
  title: The deadbeat law removes a voltage error its model does not account for
  shall: >
    The deadbeat current law shall estimate the voltage its model does not account for from the
    difference between each measured current and the current it predicted for that sample, at the
    current loop's bandwidth, and shall subtract that estimate from its command, starting afresh
    whenever the loop is reset. On the bench motor with each duty applied a period late and a stored
    flux linkage 1.5 times the motor's, after 120 ms at 0.5 A the deadbeat law shall bring the
    q-axis current to a 0 A setpoint and enter and then stay inside a 10 percent band within 1 ms,
    with an overshoot below 30 percent, its tail within 7 percent of the step and a steady-state
    error below 0.02 A, where without the estimate the current stays near 0.39 A and keeps the
    rotor accelerating.
