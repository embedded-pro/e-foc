---
name: Software-in-the-Loop Tests

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: read

concurrency:
  group: ${{ github.ref }}-sil-tests
  cancel-in-progress: true

jobs:
  software_in_the_loop_tests:
    name: Software-in-the-Loop Tests
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e_foc.qemu_sil_tests
          path: sil_runner/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e_foc.sync_foc_sensored.qemu.elf
          path: qemu_elf/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Run software-in-the-loop tests
        env:
          QEMU_SIL_ELF: ${{ github.workspace }}/qemu_elf/e_foc.sync_foc_sensored.main.elf
        run: |
          chmod +x sil_runner/e_foc.qemu_sil_tests
          sil_runner/e_foc.qemu_sil_tests \
            --format summary pretty junit:sil-test-report.xml \
            -- integration_tests/software_in_the_loop/features
      - name: Generate SIL test summary
        if: always()
        run: |
          if [[ ! -f sil-test-report.xml ]]; then
            {
              echo "## Software-in-the-Loop Test Results"
              echo ""
              echo "_Report not generated — test step did not produce output._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Software-in-the-Loop Test Results"
            echo ""
            python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('sil-test-report.xml')
          root = tree.getroot()
          suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
          features = {}
          for suite in suites:
              for tc in suite.findall('testcase'):
                  feature = tc.get('classname', 'Unknown')
                  name = tc.get('name', 'Unknown')
                  failed = tc.find('failure') is not None
                  skipped = tc.find('skipped') is not None
                  status = ':x:' if failed else ':zzz:' if skipped else ':white_check_mark:'
                  features.setdefault(feature, []).append((name, status))
          for feature, scenarios in features.items():
              print(f'### {feature}')
              print('| Scenario | Status |')
              print('|---|---|')
              for name, status in scenarios:
                  print(f'| {name} | {status} |')
              print()
          "
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          check_name: Software-in-the-Loop Test Results
          comment_title: Software-in-the-Loop Test Results
          comment_mode: off
          files: sil-test-report.xml
          report_individual_runs: true
          report_suite_logs: info
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sil-test-report
          path: sil-test-report.xml
          if-no-files-found: ignore
