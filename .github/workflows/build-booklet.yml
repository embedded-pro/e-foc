---
name: Build Design Booklet

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - ".github/workflows/build-booklet.yml"
  pull_request:
    paths:
      - "documentation/**"
      - ".github/workflows/build-booklet.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booklet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Booklet (PDF + Site)
    runs-on: ubuntu-latest
    # Pandoc, the XeLaTeX tool chain, mermaid-cli and pdf2svg come with the container image.
    container: gabrielfrasantos/embedded-devcontainer-documentation:v7.4.0@sha256:0537b16931e116f98fd62e0bad454af5bcd102ec6501ccdef2b270aa83fd281e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout belongs to the runner user, while the container runs as root.
      - name: Mark the workspace as a safe Git directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Check animations are up to date
        run: python3 documentation/tools/generate-animations.py --check

      - name: Build booklet (PDF + site)
        run: python3 documentation/tools/build-foc-booklet.py --format all

      - name: Upload PDF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e-foc-design-booklet
          path: build/booklet/eFocDesign.pdf

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e-foc-design-booklet-site
          path: build/booklet/site

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/booklet/site

  attach-to-release:
    name: Attach PDF to Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e-foc-design-booklet

      - name: Attest PDF provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: eFocDesign.pdf

      - name: Attach PDF to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: eFocDesign.pdf

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
