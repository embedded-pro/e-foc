---
name: Build Design Booklet

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - ".github/workflows/build-booklet.yml"
  pull_request:
    paths:
      - "documentation/**"
      - ".github/workflows/build-booklet.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booklet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Booklet (PDF + Site)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Pandoc and the TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended \
            lmodern \
            fonts-dejavu-core \
            librsvg2-bin \
            pdf2svg

      - name: Install diagram tooling
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Build booklet (PDF + site)
        run: python documentation/tools/build-foc-booklet.py --format all

      - name: Upload PDF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e-foc-design-booklet
          path: build/booklet/eFocDesign.pdf

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e-foc-design-booklet-site
          path: build/booklet/site

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/booklet/site

  attach-to-release:
    name: Attach PDF to Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e-foc-design-booklet

      - name: Attach PDF to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: eFocDesign.pdf

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
