---
name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check every release asset without creating a release"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  release_please:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      build: ${{ steps.release.outputs.release_created == 'true' || inputs.dry_run == true }}
      version: ${{ steps.release.outputs.tag_name || format('dry-run-{0}', github.run_number) }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: ${{ !inputs.dry_run }}
        id: token
        with:
          app-id: ${{ vars.FOREST_RELEASER_APP_ID }}
          private-key: ${{ secrets.FOREST_RELEASER_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: ${{ !inputs.dry_run }}
        id: release
        with:
          token: ${{ steps.token.outputs.token }}

  build_tools:
    name: Tools
    needs: release_please
    if: needs.release_please.outputs.build == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-tools.yml
    with:
      version: ${{ needs.release_please.outputs.version }}
      sign: true
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit

  build_embedded:
    name: Build Embedded (${{ matrix.target }})
    needs: [release_please, build_tools]
    if: needs.release_please.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ["EK-TM4C1294XL", "NUCLEO-G474RE", "NUCLEO-H563ZI"]
        configuration: ["RelWithDebInfo"]
        gcc: ["13.2.Rel1"]
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install GNU Arm Embedded Toolchain ${{ matrix.gcc }}
        uses: carlosperate/arm-none-eabi-gcc-action@49f4db4520f840e77ab1e99b24cfac2c540a21b1 # v1.14.1
        with:
          release: ${{ matrix.gcc }}
      - run: sudo apt-get update && sudo apt-get install ninja-build xsltproc ccache
      - uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: release-${{ matrix.configuration }}-${{ matrix.target }}
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-install-package
      - run: tar -zxvf e_foc-*.tar.gz
      - run: mkdir -p install && mv e_foc-*/* install/ || true
      - name: Choose the bootloader key set
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          BOOTLOADER_KEYS_RELEASE: ${{ secrets.BOOTLOADER_KEYS_RELEASE }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "BOOTLOADER_KEYS=targets/bootloader/keys/development.keys" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$BOOTLOADER_KEYS_RELEASE" ]; then
            echo "::error::BOOTLOADER_KEYS_RELEASE is not set: a release bootloader without keys could never update a board"
            exit 1
          fi
          umask 077
          printf '%s' "$BOOTLOADER_KEYS_RELEASE" | base64 -d > "$RUNNER_TEMP/bootloader.keys"
          echo "BOOTLOADER_KEYS=$RUNNER_TEMP/bootloader.keys" >> "$GITHUB_ENV"
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: ${{ matrix.target }}
          buildPreset: ${{ matrix.target }}-${{ matrix.configuration }}
      - name: Inject the key set into the bootloader
        run: |
          images="build/${{ matrix.target }}/targets/bootloader/main/${{ matrix.configuration }}"
          if [ ! -f "$images/e_foc.bootloader.main.elf" ]; then
            echo "::notice::${{ matrix.target }} builds no bootloader: no key slot to fill"
            exit 0
          fi
          hex=()
          for file in "$images"/*.hex; do hex+=(--hex "$file"); done
          "build/${{ matrix.target }}/_native_bootloader_image/bin/application.bootloader_image" inject-keys \
            --keys "$BOOTLOADER_KEYS" --elf "$images/e_foc.bootloader.main.elf" "${hex[@]}"
      - name: Pack the application for an update over CAN
        run: |
          script="build/${{ matrix.target }}/targets/sync_foc_sensored/main/${{ matrix.configuration }}/e_foc.sync_foc_sensored.main.upgrade_pack.cmake"
          if [ ! -f "$script" ]; then
            echo "::notice::${{ matrix.target }} has no bootloader: no upgrade pack"
            exit 0
          fi
          cmake -D KEYS="$BOOTLOADER_KEYS" \
            -D OUTPUT="e_foc-firmware-${{ matrix.target }}-sync_foc_sensored-${{ needs.release_please.outputs.version }}.upgrade" \
            -P "$script"
      - name: Generate hex firmware
        run: |
          find "build/${{ matrix.target }}" -name "*.elf" -path "*/${{ matrix.configuration }}/*" -type f | while read -r elf; do
            hex="${elf%.elf}.hex"
            arm-none-eabi-objcopy -O ihex "$elf" "$hex"
          done
      - name: Package firmware
        run: |
          version="${{ needs.release_please.outputs.version }}"
          staging="staging/${{ matrix.target }}"
          mkdir -p "$staging"
          find "build/${{ matrix.target }}" -name "e_foc.*.main.elf" -path "*/${{ matrix.configuration }}/*" -type f | while read -r elf; do
            app="$(basename "$elf" .main.elf)"
            app="${app#e_foc.}"
            for image in "${elf%.elf}.elf" "${elf%.elf}.hex"; do
              cp "$image" "$staging/e_foc-firmware-${{ matrix.target }}-${app}-${version}.${image##*.}"
            done
          done
          pack="e_foc-firmware-${{ matrix.target }}-sync_foc_sensored-${version}.upgrade"
          if [ -f "$pack" ]; then
            cp "$pack" "$staging/"
          fi
          ls -l "$staging"
          tar -czf "e_foc-firmware-${{ matrix.target }}-${version}.tar.gz" -C staging "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.target }}
          path: e_foc-firmware-${{ matrix.target }}-*.tar.gz
          if-no-files-found: error
      # Released CAN Commanders find a board's pack by this asset name, so the pack stays a standalone asset too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-pack-${{ matrix.target }}
          path: e_foc-firmware-${{ matrix.target }}-sync_foc_sensored-*.upgrade
          if-no-files-found: ignore

  package_source:
    name: Package Source
    needs: release_please
    if: needs.release_please.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Archive source with submodules
        run: |
          version="${{ needs.release_please.outputs.version }}"
          archive="e_foc-source-${version}.tar.gz"
          git ls-files --recurse-submodules -z | tar --null -T - --transform "s,^,e_foc-${version}/," -czf "$archive"
          tar -tzf "$archive" | grep -q "^e_foc-${version}/infra/embedded-infra-lib/CMakeLists.txt$"
          tar -tzf "$archive" | grep -q "^e_foc-${version}/CMakeLists.txt$"
          ls -l "$archive"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: e_foc-source-*.tar.gz
          if-no-files-found: error

  build_documentation:
    name: Build Documentation
    needs: release_please
    if: needs.release_please.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-documentation:v7.5.1@sha256:2350b2883336fbac7082d5cbfe348e4e84765c26cde239d8fb9804cb896b7372
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Generate the traceability matrix
        uses: embedded-pro/project-documentation@e1b8b6866333964f2e02b29bba322cbee211819b # v0.3.0
        with:
          python-version: ''
          run-traceability-matrix: 'true'
          requirements-dir: documentation/verification_and_validation/requirements
          features-dir: integration_tests/features
          matrix-output: docs-pdf/traceability-matrix.md
      - name: Build the booklet and the document PDFs
        run: |
          python3 documentation/tools/build-foc-booklet.py --format pdf documents \
            --version "${{ needs.release_please.outputs.version }}" \
            --traceability-matrix docs-pdf/traceability-matrix.md
      - name: Bundle the documentation
        shell: bash
        run: |
          v="${{ needs.release_please.outputs.version }}"
          docs="e_foc-documentation-${v}"
          mkdir "$docs"
          cp build/booklet/eFocDesign.pdf "$docs/"
          cp -r build/booklet/documents/. "$docs/"
          for folder in design theory verification_and_validation; do
            compgen -G "$docs/$folder/*.pdf" > /dev/null || { echo "::error::no $folder PDFs"; exit 1; }
          done
          python3 -m zipfile -c "${docs}.zip" "$docs"
          python3 -m zipfile -l "${docs}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: e_foc-documentation-*.zip
          if-no-files-found: error

  publish_release_assets:
    name: Publish Release Assets
    needs:
      [
        release_please,
        build_tools,
        build_embedded,
        build_documentation,
        package_source
      ]
    if: needs.release_please.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Remove host install package
        run: rm -f release-assets/e_foc-0*.* release-assets/e_foc-*-Linux.*
      - name: Check release assets
        run: |
          v="${{ needs.release_please.outputs.version }}"
          ls -l release-assets
          for asset in \
            "e_foc-can_commander-${v}-linux-x86_64.tar.gz" \
            "e_foc-can_commander-${v}-linux-x86_64.deb" \
            "e_foc-can_commander-${v}-windows-x86_64.zip" \
            "e_foc-can_commander-${v}-windows-x86_64-setup.exe" \
            "e_foc-firmware-EK-TM4C1294XL-${v}.tar.gz" \
            "e_foc-firmware-NUCLEO-G474RE-${v}.tar.gz" \
            "e_foc-firmware-NUCLEO-H563ZI-${v}.tar.gz" \
            "e_foc-firmware-EK-TM4C1294XL-sync_foc_sensored-${v}.upgrade" \
            "e_foc-source-${v}.tar.gz" \
            "e_foc-documentation-${v}.zip"; do
            test -s "release-assets/$asset" || { echo "::error::missing release asset $asset"; exit 1; }
          done
          for image in bootloader-${v}.hex sync_foc_sensored-${v}.hex hardware_test-${v}.hex sync_foc_sensored-${v}.upgrade; do
            tar -tzf "release-assets/e_foc-firmware-EK-TM4C1294XL-${v}.tar.gz" | grep -qx "EK-TM4C1294XL/e_foc-firmware-EK-TM4C1294XL-${image}" \
              || { echo "::error::e_foc-firmware-EK-TM4C1294XL-${v}.tar.gz lacks e_foc-firmware-EK-TM4C1294XL-${image}"; exit 1; }
          done
          if compgen -G "release-assets/*.hex" > /dev/null; then
            echo "::error::firmware images left outside the board archives"
            exit 1
          fi
          if compgen -G "release-assets/*.pdf" > /dev/null; then
            echo "::error::documentation PDFs left outside the zip"
            exit 1
          fi
      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Verify release asset provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.release_please.outputs.version }}"
          for asset in \
            "e_foc-can_commander-${v}-windows-x86_64-setup.exe" \
            "e_foc-can_commander-${v}-linux-x86_64.deb" \
            "e_foc-firmware-EK-TM4C1294XL-${v}.tar.gz" \
            "e_foc-firmware-EK-TM4C1294XL-sync_foc_sensored-${v}.upgrade"; do
            gh attestation verify "release-assets/$asset" --repo "${{ github.repository }}"
          done
      - name: Upload release assets
        if: needs.release_please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.release_please.outputs.version }}"
          for asset in release-assets/*; do
            [ -f "$asset" ] || continue
            echo "Uploading: $asset"
            gh release upload "$tag" "$asset" --repo "$GH_REPO"
          done
