---
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  GTEST_COLOR: 1

jobs:
  host_build_test_ubuntu:
    name: Host Build & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-ubuntu-latest
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: "host"
          buildPreset: "host-Debug-WithPackage"
          testPreset: "host"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e_foc
          path: build/host/e_foc-*-Linux.tar.gz
          if-no-files-found: error
      - name: Upload QEMU SIL test runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e_foc.qemu_sil_tests
          path: build/host/integration_tests/software_in_the_loop/qemu_main/e_foc.qemu_sil_tests
          if-no-files-found: error
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs
          path: build/host/Testing/Temporary/
  host_cross_windows:
    name: Host Cross-Compile (Linux → Windows)
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ github.job }}-windows-cross-${{ github.sha }}
          restore-keys: ${{ github.job }}-windows-cross-
      - name: Cross-compile for Windows
        run: cmake --preset windows && cmake --build --preset windows-RelWithDebInfo
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e_foc-windows
          path: build/windows/**/*.exe
          if-no-files-found: warn
  embedded_build:
    name: Embedded Build
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    needs: [host_build_test_ubuntu, host_cross_windows]
    strategy:
      matrix:
        configuration: ["RelWithDebInfo"]
        target:
          [
            "EK-TM4C1294XL",
            "EK-TM4C123GXL",
            "STM32F407G-DISC1",
            "NUCLEO-H563ZI"
          ]
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN  }}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ matrix.configuration }}-${{ matrix.target }}
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e_foc
      - run: tar -zxvf e_foc-*.tar.gz
      - run: mkdir install && mv e_foc-*/* install/
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: ${{ matrix.target }}
          buildPreset: ${{ matrix.target }}-${{ matrix.configuration }}
      - name: Run inner loop cycle analysis
        if: matrix.target == 'EK-TM4C1294XL'
        uses: embedded-pro/cortex-cycle-budget@de7fc1f448138bf1ee96f03d46d8a675023b6008 # v0.2.2
        with:
          comment-marker: "<!-- cycle-analysis-inner-comment -->"
          config-path: targets/sync_foc_sensored/main/cycle-analysis.json
          elf-path: build/${{ matrix.target }}/targets/sync_foc_sensored/main/${{ matrix.configuration }}/e_foc.sync_foc_sensored.main.elf
          target: ${{ matrix.target }}
          build-config: ${{ matrix.configuration }}
          clock-mhz: "120"
          cortex: "m4"
          output-dir: cycle-analysis/inner
          fail-over-max-cycles: "4500"
          post-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          artifact-name: cycle-analysis-inner
      - name: Inner loop cycle analysis summary
        if: matrix.target == 'EK-TM4C1294XL'
        run: cat cycle-analysis/inner/cycle_estimation_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run outer loop cycle analysis
        if: matrix.target == 'EK-TM4C1294XL'
        uses: embedded-pro/cortex-cycle-budget@de7fc1f448138bf1ee96f03d46d8a675023b6008 # v0.2.2
        with:
          comment-marker: "<!-- cycle-analysis-outer-comment -->"
          config-path: targets/sync_foc_sensored/main/cycle-analysis-outer.json
          elf-path: build/${{ matrix.target }}/targets/sync_foc_sensored/main/${{ matrix.configuration }}/e_foc.sync_foc_sensored.main.elf
          target: ${{ matrix.target }}
          build-config: ${{ matrix.configuration }}
          clock-mhz: "120"
          cortex: "m4"
          output-dir: cycle-analysis/outer
          fail-over-max-cycles: "20000"
          post-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          artifact-name: cycle-analysis-outer
      - name: Outer loop cycle analysis summary
        if: matrix.target == 'EK-TM4C1294XL'
        run: cat cycle-analysis/outer/cycle_estimation_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run memory analysis
        if: matrix.target == 'EK-TM4C1294XL'
        uses: embedded-pro/cortex-memory-budget@cc5057b824ad7a5c340dfa6a3c8d22be0b89b35c
        with:
          comment-marker: '<!-- memory-analysis-comment -->'
          analyses-json: |
            [
              {
                "label": "Unified binary",
                "elf_path": "build/${{ matrix.target }}/targets/sync_foc_sensored/main/${{ matrix.configuration }}/e_foc.sync_foc_sensored.main.elf",
                "config_path": "targets/sync_foc_sensored/main/memory-analysis.json",
                "linker_script": "infra/hal/ti/tiva/ldscripts/mem_tm4c1294ncpdt.ld",
                "output_dir": "memory-analysis"
              }
            ]
          target: ${{ matrix.target }}
          build-config: ${{ matrix.configuration }}
          cortex: "m4"
          output-dir: memory-analysis
          post-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          artifact-name: memory-analysis
      - name: Memory analysis summary
        if: matrix.target == 'EK-TM4C1294XL'
        run: cat memory-analysis/combined_step_summary.md >> "$GITHUB_STEP_SUMMARY"
  qemu_foc_sensored_build:
    name: QEMU FOC Sensored Application Build
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-qemu-foc-sensored
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: qemu-foc-sensored
          buildPreset: qemu-foc-sensored-RelWithDebInfo
      - name: Upload QEMU FOC Sensored ELF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e_foc.sync_foc_sensored.qemu.elf
          path: build/qemu-foc-sensored/targets/sync_foc_sensored/main/RelWithDebInfo/e_foc.sync_foc_sensored.main.elf
          if-no-files-found: error

  qemu_sil_behavioral_tests:
    name: QEMU SIL Behavioral Tests (host runner)
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    needs: [host_build_test_ubuntu, qemu_foc_sensored_build]
    steps:
      - name: Configure Git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e_foc.qemu_sil_tests
          path: qemu_runner/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e_foc.sync_foc_sensored.qemu.elf
          path: qemu_elf/
      - name: Run QEMU SIL behavioral tests
        env:
          QEMU_SIL_ELF: ${{ github.workspace }}/qemu_elf/e_foc.sync_foc_sensored.main.elf
        run: |
          chmod +x qemu_runner/e_foc.qemu_sil_tests
          qemu_runner/e_foc.qemu_sil_tests \
            --format summary pretty junit:qemu-sil-test-report.xml \
            -- integration_tests/software_in_the_loop/features
      - name: Generate QEMU SIL test summary
        if: always()
        run: |
          if [[ ! -f qemu-sil-test-report.xml ]]; then
            {
              echo "## QEMU SIL Behavioral Test Results"
              echo ""
              echo "_Report not generated — test step did not produce output._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## QEMU SIL Behavioral Test Results"
            echo ""
            python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('qemu-sil-test-report.xml')
          root = tree.getroot()
          suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
          features = {}
          for suite in suites:
              for tc in suite.findall('testcase'):
                  feature = tc.get('classname', 'Unknown')
                  name = tc.get('name', 'Unknown')
                  failed = tc.find('failure') is not None
                  skipped = tc.find('skipped') is not None
                  status = ':x:' if failed else ':zzz:' if skipped else ':white_check_mark:'
                  features.setdefault(feature, []).append((name, status))
          for feature, scenarios in features.items():
              print(f'### {feature}')
              print('| Scenario | Status |')
              print('|---|---|')
              for name, status in scenarios:
                  print(f'| {name} | {status} |')
              print()
          "
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          check_name: QEMU SIL Behavioral Test Results
          comment_title: QEMU SIL Behavioral Test Results
          files: qemu-sil-test-report.xml
          report_individual_runs: true
          report_suite_logs: info
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-sil-test-report
          path: qemu-sil-test-report.xml
          if-no-files-found: ignore
