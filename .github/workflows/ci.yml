---
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  GTEST_COLOR: 1

jobs:
  host_build_test_ubuntu:
    name: Host Build & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-ubuntu-latest
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: "host"
          buildPreset: "host-Debug-WithPackage"
          testPreset: "host"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e_foc
          path: build/host/e_foc-*-Linux.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e_foc.integration_tests
          path: build/host/integration_tests/main/Debug/e_foc.integration_tests
          if-no-files-found: error
      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: build/host/Testing/Temporary/
  release_tools_build:
    name: Release Tools Build
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-tools.yml
    with:
      version: ci-${{ github.run_number }}
      retention_days: 7
    secrets: inherit
  embedded_build:
    name: Embedded Build
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    needs: [host_build_test_ubuntu]
    strategy:
      fail-fast: false
      matrix:
        configuration: ["RelWithDebInfo"]
        target:
          ["EK-TM4C1294XL", "EK-TM4C123GXL", "NUCLEO-G474RE", "NUCLEO-H563ZI"]
        # Each budget is the same slice of time on every MCU, in cycles of its clock: 37.5 us inner loop (75% of
        # the 20 kHz period), 166.7 us outer loop, 50 us identification path (the whole period: it runs only
        # while calibrating, where nothing but the 1 kHz outer loop competes for it).
        include:
          - target: EK-TM4C1294XL
            budget-analysis: true
            clock-mhz: 120
            linker-script: infra/hal/ti/tiva/ldscripts/mem_tm4c1294ncpdt.ld
            inner-max-cycles: 4500
            outer-max-cycles: 20000
            identification-max-cycles: 6000
          - target: NUCLEO-G474RE
            budget-analysis: true
            clock-mhz: 170
            linker-script: infra/hal/st/st/ldscripts/mem_stm32g474.ld
            inner-max-cycles: 6375
            outer-max-cycles: 28333
            identification-max-cycles: 8500
    env:
      FIRMWARE_ELF: build/${{ matrix.target }}/targets/sync_foc_sensored/main/${{ matrix.configuration }}/e_foc.sync_foc_sensored.main.elf
      POST_PR_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.configuration }}-${{ matrix.target }}
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e_foc
      - run: tar -zxvf e_foc-*.tar.gz
      - run: mkdir install && mv e_foc-*/* install/
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        id: build
        with:
          configurePreset: ${{ matrix.target }}
          buildPreset: ${{ matrix.target }}-${{ matrix.configuration }}
      # The three paths run even when an earlier one is over budget, so the banner always shows all of them.
      - name: Run inner loop cycle analysis
        if: ${{ !cancelled() && matrix.budget-analysis && steps.build.outcome == 'success' }}
        uses: embedded-pro/cortex-cycle-budget@de7fc1f448138bf1ee96f03d46d8a675023b6008 # v0.2.2
        with:
          config-path: targets/sync_foc_sensored/main/cycle-analysis.json
          elf-path: ${{ env.FIRMWARE_ELF }}
          target: ${{ matrix.target }}
          build-config: ${{ matrix.configuration }}
          clock-mhz: ${{ matrix.clock-mhz }}
          cortex: "m4"
          output-dir: cycle-analysis/inner
          fail-over-max-cycles: ${{ matrix.inner-max-cycles }}
          post-comment: "false"
          artifact-name: cycle-analysis-${{ matrix.target }}-inner
      - name: Run outer loop cycle analysis
        if: ${{ !cancelled() && matrix.budget-analysis && steps.build.outcome == 'success' }}
        uses: embedded-pro/cortex-cycle-budget@de7fc1f448138bf1ee96f03d46d8a675023b6008 # v0.2.2
        with:
          config-path: targets/sync_foc_sensored/main/cycle-analysis-outer.json
          elf-path: ${{ env.FIRMWARE_ELF }}
          target: ${{ matrix.target }}
          build-config: ${{ matrix.configuration }}
          clock-mhz: ${{ matrix.clock-mhz }}
          cortex: "m4"
          output-dir: cycle-analysis/outer
          fail-over-max-cycles: ${{ matrix.outer-max-cycles }}
          post-comment: "false"
          artifact-name: cycle-analysis-${{ matrix.target }}-outer
      - name: Run identification path cycle analysis
        if: ${{ !cancelled() && matrix.budget-analysis && steps.build.outcome == 'success' }}
        uses: embedded-pro/cortex-cycle-budget@de7fc1f448138bf1ee96f03d46d8a675023b6008 # v0.2.2
        with:
          config-path: targets/sync_foc_sensored/main/cycle-analysis-identification.json
          elf-path: ${{ env.FIRMWARE_ELF }}
          target: ${{ matrix.target }}
          build-config: ${{ matrix.configuration }}
          clock-mhz: ${{ matrix.clock-mhz }}
          cortex: "m4"
          output-dir: cycle-analysis/identification
          fail-over-max-cycles: ${{ matrix.identification-max-cycles }}
          post-comment: "false"
          artifact-name: cycle-analysis-${{ matrix.target }}-identification
      - name: Compose cycle analysis banner
        if: ${{ !cancelled() && matrix.budget-analysis && steps.build.outcome == 'success' }}
        run: >-
          python3 .github/scripts/cycle-analysis-banner.py
          --target "${{ matrix.target }}"
          --build-config "${{ matrix.configuration }}"
          --cortex m4
          --clock-mhz "${{ matrix.clock-mhz }}"
          --marker "<!-- cycle-analysis-${{ matrix.target }}-comment -->"
          --artifact-prefix "cycle-analysis-${{ matrix.target }}"
          --analysis "Inner loop" cycle-analysis/inner "${{ matrix.inner-max-cycles }}"
          --analysis "Outer loop" cycle-analysis/outer "${{ matrix.outer-max-cycles }}"
          --analysis "Identification path" cycle-analysis/identification "${{ matrix.identification-max-cycles }}"
          --output cycle-analysis/banner.md
      - name: Post cycle analysis banner
        if: ${{ !cancelled() && matrix.budget-analysis && steps.build.outcome == 'success' && env.POST_PR_COMMENT == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MARKER: <!-- cycle-analysis-${{ matrix.target }}-comment -->
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('cycle-analysis/banner.md', 'utf8');
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(process.env.MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner: issue.owner, repo: issue.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
      - name: Run memory analysis
        if: ${{ !cancelled() && matrix.budget-analysis && steps.build.outcome == 'success' }}
        uses: embedded-pro/cortex-memory-budget@cc5057b824ad7a5c340dfa6a3c8d22be0b89b35c
        with:
          comment-marker: "<!-- memory-analysis-${{ matrix.target }}-comment -->"
          analyses-json: |
            [
              {
                "label": "Unified binary",
                "elf_path": "${{ env.FIRMWARE_ELF }}",
                "config_path": "targets/sync_foc_sensored/main/memory-analysis.json",
                "linker_script": "${{ matrix.linker-script }}",
                "output_dir": "memory-analysis"
              }
            ]
          target: ${{ matrix.target }}
          build-config: ${{ matrix.configuration }}
          cortex: "m4"
          output-dir: memory-analysis
          post-comment: ${{ env.POST_PR_COMMENT }}
          artifact-name: memory-analysis-${{ matrix.target }}
  qemu_foc_sensored_build:
    name: QEMU FOC Sensored Application Build
    runs-on: ubuntu-latest
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-qemu-foc-sensored
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: qemu-foc-sensored
          buildPreset: qemu-foc-sensored-RelWithDebInfo
      - name: Upload QEMU FOC Sensored ELF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e_foc.sync_foc_sensored.qemu.elf
          path: build/qemu-foc-sensored/targets/sync_foc_sensored/main/RelWithDebInfo/e_foc.sync_foc_sensored.main.elf
          if-no-files-found: error
  software_in_the_loop_shard:
    name: Software-in-the-Loop Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: gabrielfrasantos/embedded-devcontainer-cpp:v7.3.0@sha256:4f92e9c86dfc5a9688b6134944e7a40c9eb3c658022ea62dc9e57e4c3b056940
    needs: [host_build_test_ubuntu, qemu_foc_sensored_build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SIL_SHARDS: 3
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Select the shard's features
        id: shard
        run: echo "features=$(python3 integration_tests/sil-shard.py --shard ${{ matrix.shard }} --of "$SIL_SHARDS")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e_foc.integration_tests
          path: sil_runner/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e_foc.sync_foc_sensored.qemu.elf
          path: qemu_elf/
      - name: Verify software-in-the-loop prerequisites
        env:
          QEMU_SIL_ELF: ${{ github.workspace }}/qemu_elf/e_foc.sync_foc_sensored.main.elf
        run: |
          command -v qemu-system-arm >/dev/null || { echo "::error::qemu-system-arm not found; SIL scenarios would skip silently"; exit 1; }
          test -f "$QEMU_SIL_ELF" || { echo "::error::SIL ELF $QEMU_SIL_ELF missing; SIL scenarios would skip silently"; exit 1; }
      - name: Run software-in-the-loop tests
        shell: bash
        env:
          QEMU_SIL_ELF: ${{ github.workspace }}/qemu_elf/e_foc.sync_foc_sensored.main.elf
          SIL_FEATURES: ${{ steps.shard.outputs.features }}
        run: |
          chmod +x sil_runner/e_foc.integration_tests
          read -ra features <<< "$SIL_FEATURES"
          sil_runner/e_foc.integration_tests \
            --mode sil \
            "${features[@]}" \
            -t "@sil" \
            --format summary \
            --format pretty \
            --format "junit:sil-test-report-${{ matrix.shard }}.xml"
      - name: Generate SIL test summary
        if: always()
        shell: bash
        env:
          SIL_REPORT: sil-test-report-${{ matrix.shard }}.xml
        run: |
          if [[ ! -f "$SIL_REPORT" ]]; then
            {
              echo "## Software-in-the-Loop Test Results (shard ${{ matrix.shard }})"
              echo ""
              echo "_Report not generated — test step did not produce output._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Software-in-the-Loop Test Results (shard ${{ matrix.shard }})"
            echo ""
            python3 -c "
          import os
          import xml.etree.ElementTree as ET
          tree = ET.parse(os.environ['SIL_REPORT'])
          root = tree.getroot()
          suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
          features = {}
          for suite in suites:
              for tc in suite.findall('testcase'):
                  feature = tc.get('classname', 'Unknown')
                  name = tc.get('name', 'Unknown')
                  failed = tc.find('failure') is not None
                  skipped = tc.find('skipped') is not None
                  status = ':x:' if failed else ':zzz:' if skipped else ':white_check_mark:'
                  features.setdefault(feature, []).append((name, status))
          for feature, scenarios in features.items():
              print(f'### {feature}')
              print('| Scenario | Status |')
              print('|---|---|')
              for name, status in scenarios:
                  print(f'| {name} | {status} |')
              print()
          "
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sil-test-report-${{ matrix.shard }}
          path: sil-test-report-${{ matrix.shard }}.xml
          if-no-files-found: ignore
  software_in_the_loop_tests:
    name: Software-in-the-Loop Tests
    runs-on: ubuntu-latest
    needs: [software_in_the_loop_shard]
    if: ${{ always() }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sil-test-report-*
          merge-multiple: true
      - uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always()
        with:
          check_name: Software-in-the-Loop Test Results
          comment_title: Software-in-the-Loop Test Results
          comment_mode: off
          files: sil-test-report-*.xml
          report_individual_runs: true
          report_suite_logs: info
      - name: Require every shard to pass
        if: always()
        env:
          SHARDS_RESULT: ${{ needs.software_in_the_loop_shard.result }}
        run: |
          [[ "$SHARDS_RESULT" == "success" ]] || { echo "::error::Software-in-the-loop shards finished with: $SHARDS_RESULT"; exit 1; }
